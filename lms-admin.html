<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | UESTC H189</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #003399; --bg: #f4f4f9; --asmt-yellow: #fff9c4; --asmt-urgent: #ffcdd2; --teacher-green: #e8f5e9; --glass: rgba(255, 255, 255, 0.9); }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); margin: 0; overflow-x: hidden; }
        
        /* LOGIN STYLES */
        #login-overlay { position: fixed; inset: 0; background: #1a1a1a; z-index: 10000; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 320px; text-align: center; }
        .login-card input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .login-card button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

        #sidebar-toggle { position: fixed; right: 0; top: 0; bottom: 0; width: 35px; background: #333; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl; z-index: 1001; font-weight: bold; }
        #student-manager { position: fixed; right: -65%; top: 0; bottom: 0; width: 60%; background: #fff; box-shadow: -10px 0 30px rgba(0,0,0,0.15); z-index: 1000; transition: 0.4s ease; padding: 25px; overflow-y: auto; border-left: 5px solid var(--primary); }
        #student-manager.open { right: 35px; }
        header { background: #1a1a1a; color: white; padding: 20px; text-align: center; border-bottom: 4px solid var(--primary); }
        .container { max-width: 1100px; margin: 20px auto; padding: 0 50px 0 20px; }
        
        .calendar-nav { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 15px; }
        .nav-btn { background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .nav-btn:hover { opacity: 0.9; }
        .today-btn { background: #666; }
        
        .calendar-section { background: var(--glass); backdrop-filter: blur(10px); border-radius: 16px; padding: 20px; margin-bottom: 30px; box-shadow: 0 8px 32px rgba(0,0,0,0.05); border: 1px solid #ddd; display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; }
        .month-box { flex: 1; min-width: 300px; max-width: 380px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .cal-day { aspect-ratio: 1/1; background: white; border-radius: 8px; border: 1px solid #eee; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.9rem; position: relative; cursor: pointer; }
        .today { background: var(--primary) !important; color: white !important; font-weight: bold; }
        .has-deadline { border: 2px solid #ff5252; }
        .dot { width: 5px; height: 5px; background: #ff5252; border-radius: 50%; margin-top: 2px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .card img { width: 100%; height: 160px; object-fit: cover; cursor: pointer; }
        .tab-block { margin: 15px 0; border-radius: 10px; background: white; border: 1px solid #ddd; overflow: hidden; }
        .tab-header { display: flex; align-items: center; padding: 12px 15px; cursor: grab; gap: 10px; }
        .tab-header:active { cursor: grabbing; }
        .type-lecture { background: #e3f2fd; color: #003399; border-left: 8px solid #003399; }
        .type-assessment { background: var(--asmt-yellow); color: #333; border-left: 8px solid #fbc02d; }
        .urgent { background: var(--asmt-urgent) !important; border-left-color: #d32f2f !important; }
        .item-row { display: flex; align-items: center; background: #fff; padding: 10px; margin: 5px 0; border-radius: 6px; border: 1px solid #eee; gap: 10px; cursor: grab; }
        .btn-action { padding: 6px 12px; border-radius: 4px; cursor: pointer; border: 1px solid #ccc; font-size: 0.75rem; background: #fdfdfd; font-weight: bold; }
        .btn-save { background: #2e7d32; color: white; border: none; }
        .btn-danger { background: #d32f2f; color: white; border: none; }
        .hidden { display: none; }
        .group-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; margin-top: 20px; }
        .group-card { background: white; border: 1px solid #ddd; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .group-header { background: #1a1a1a; color: white; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        .zone { padding: 10px; border-bottom: 1px solid #eee; }
        .zone-label { font-size: 9px; font-weight: bold; color: #999; margin-bottom: 5px; text-transform: uppercase; }
        .tag-container { display: flex; flex-wrap: wrap; gap: 8px; min-height: 40px; padding: 10px; background: #fafafa; border-radius: 8px; border: 1px dashed #ddd; }
        .mini-tag { background: white; border: 1px solid #ccc; padding: 4px 10px; border-radius: 6px; font-size: 12px; display: flex; align-items: center; gap: 5px; cursor: grab; }
        .deadline-popup { position: fixed; background: rgba(0,0,0,0.85); color: white; padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; z-index: 9999; pointer-events: none; transform: translate(-50%, -130%); }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-card">
        <h2 style="color:var(--primary); margin-top:0;">Portal Access</h2>
        <input type="text" id="login-user" placeholder="Username">
        <input type="password" id="login-pass" placeholder="Password">
        <button onclick="handleLogin()">Login</button>
        <p id="login-error" style="color:red; font-size:12px; margin-top:10px; display:none;">Invalid credentials</p>
    </div>
</div>

<div id="sidebar-toggle" onclick="toggleSidebar()">SYSTEM MANAGEMENT ◀</div>

<div id="student-manager">
    <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
        <h2 style="margin:0; color:var(--primary)">System Management</h2>
        <button onclick="toggleSidebar()" class="btn-action">Close ✖</button>
    </div>

    <div style="background:var(--teacher-green); padding:15px; border-radius:12px; border:1px solid #c8e6c9; margin-bottom:20px;">
        <span style="font-size:11px; font-weight:bold; color:#2e7d32;">TEACHER LIBRARY</span>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <input id="t-name" placeholder="Name" style="flex:1; padding:8px;">
            <input id="t-pass" placeholder="Password" style="flex:1; padding:8px;">
            <button onclick="addTeacher()" class="btn-action btn-save">Add</button>
        </div>
        <div id="lib-teachers" class="tag-container" style="margin-top:15px;"></div>
    </div>

    <div style="background:#f8f9fa; padding:15px; border-radius:12px; border:1px solid #ddd; margin-bottom:20px;">
        <span style="font-size:11px; font-weight:bold; color:#999;">STUDENT LIBRARY</span>
        <div style="display:flex; gap:10px; margin-top:10px;">
            <input id="u-name" placeholder="Name" style="flex:1; padding:8px;">
            <input id="u-pass" placeholder="Password" style="flex:1; padding:8px;">
            <button onclick="addUser()" class="btn-action btn-save">Add</button>
        </div>
        <div style="margin-top:15px; padding-top:10px; border-top:1px solid #eee;">
            <span style="font-size:11px; color:#666;">BULK UPLOAD (Excel)</span>
            <div style="display:flex; align-items:center; gap:10px; margin-top:5px;">
                <input type="file" id="excel-file" accept=".xlsx, .xls" style="font-size:11px;">
                <button onclick="handleExcelUpload()" class="btn-action">Upload</button>
            </div>
        </div>
        <div id="lib-students" class="tag-container" style="margin-top:15px;"></div>
    </div>

    <div style="background:#f8f9fa; padding:15px; border-radius:12px; border:1px solid #ddd; margin-bottom:20px;">
        <span style="font-size:11px; font-weight:bold; color:#999;">UNIT LIBRARY</span>
        <div id="lib-units" class="tag-container"></div>
    </div>

    <div style="display:flex; justify-content: space-between; align-items: center;">
        <h3 style="margin:0">Groups & Assignments</h3>
        <button onclick="addNewGroup()" class="btn-action btn-save">+ New Group</button>
    </div>
    <div id="mgr-groups" class="group-grid"></div>
</div>

<header><h1>UESTC H189 Portal</h1></header>

<div class="container">
    <div id="unit-view">
        <div class="calendar-nav">
            <button class="nav-btn" onclick="changeMonth(-1)">◀ Previous</button>
            <button class="nav-btn today-btn" onclick="resetMonth()">Today</button>
            <button class="nav-btn" onclick="changeMonth(1)">Next ▶</button>
        </div>
        <div class="calendar-section" id="calendar-area"></div>
        <div id="unit-grid" class="grid"></div>
    </div>
    <div id="detail-view" class="hidden">
        <button onclick="showOverview()" class="btn-action" style="margin-bottom:20px;">← Back to Overview</button>
        <div id="editor-content"></div>
    </div>
</div>

<script>
    const _url = 'https://btwdbphheotbqrmbswgk.supabase.co';
    const _key = 'sb_publishable_9lY3A1HrgERNIC597NEAKQ_YTCmkh2k';
    const client = supabase.createClient(_url, _key);
    let currentUnitId = null;
    let calendarOffset = 0;
    let cachedDeadlines = [];

    // --- LOGIN LOGIC ---
    async function handleLogin() {
        const u = document.getElementById('login-user').value;
        const p = document.getElementById('login-pass').value;
        const errorEl = document.getElementById('login-error');

        // 1. Admin Check
        if (u === "wangzhrm" && p === "wang123") {
            sessionStorage.setItem('role', 'admin');
            loginSuccess();
            return;
        }

        // 2. Teacher Check
        try {
            const { data: teacher } = await client.from('teacher_accounts').select('*').eq('username', u).eq('password', p).single();
            if (teacher) {
                sessionStorage.setItem('role', 'teacher');
                sessionStorage.setItem('tid', teacher.id);
                loginSuccess();
                return;
            }
            // If neither matches
            errorEl.style.display = 'block';
        } catch (e) {
            errorEl.style.display = 'block';
        }
    }

    function loginSuccess() {
        document.getElementById('login-overlay').style.display = 'none';
        init();
    }

    // Check login state on load
    window.onload = () => {
        if (sessionStorage.getItem('role')) {
            document.getElementById('login-overlay').style.display = 'none';
            init();
        }
    }

    // --- INITIALIZATION ---
    async function init() {
        const role = sessionStorage.getItem('role');
        const tid = sessionStorage.getItem('tid');

        // HIDE SIDEBAR FOR TEACHERS
        if (role === 'teacher') {
            document.getElementById('sidebar-toggle').style.display = 'none';
        } else {
            document.getElementById('sidebar-toggle').style.display = 'flex';
            loadMgr(); // Only admin loads the sidebar content
        }

        // FETCH UNITS (Admin sees all; Teacher sees assigned)
        let units = [];
        if (role === 'admin') {
            const { data } = await client.from('units').select('*').order('created_at', { ascending: true });
            units = data || [];
        } else {
            // Teacher Logic: Find groups -> Find units
            const { data: membership } = await client.from('teacher_group_membership').select('group_id').eq('teacher_id', tid);
            const gids = (membership || []).map(m => m.group_id);
            if (gids.length > 0) {
                const { data: access } = await client.from('unit_group_access').select('unit_id').in('group_id', gids);
                const uids = (access || []).map(a => a.unit_id);
                if (uids.length > 0) {
                    const { data: teacherUnits } = await client.from('units').select('*').in('id', uids);
                    units = teacherUnits || [];
                }
            }
        }

        const visibleIds = units.map(u => u.id);
        const { data: deadlines } = await client.from('lectures').select('deadline, name, units(name)').in('unit_id', visibleIds).not('deadline', 'is', null);
        cachedDeadlines = deadlines || [];
        
        const grid = document.getElementById('unit-grid');
        grid.innerHTML = (units || []).map(u => `
            <div class="card" id="unit-card-${u.id}">
                <img src="${u.header_image_url || 'https://via.placeholder.com/400x200'}" onclick="openEditor('${u.id}')">
                <div style="padding:15px; text-align:center;">
                    <strong style="display:block; margin-bottom:10px;">${u.name}</strong>
                    ${role === 'admin' ? `<button class="btn-action" onclick="editUnitInline('${u.id}', '${u.name}', '${u.header_image_url}')">Edit Info</button>` : ''}
                </div>
            </div>
        `).join('') + (role === 'admin' ? `
            <div id="add-unit-placeholder" onclick="createNewUnit()" style="border:2px dashed #ccc; display:flex; align-items:center; justify-content:center; cursor:pointer; min-height:200px; border-radius:12px; color:#999;">
                + Add Unit
            </div>` : '');

        renderCalendars();
    }

    // --- CALENDAR ---
    function changeMonth(step) { calendarOffset += step; renderCalendars(); }
    function resetMonth() { calendarOffset = 0; renderCalendars(); }

    function renderCalendars() {
        const area = document.getElementById('calendar-area'); area.innerHTML = '';
        const now = new Date();
        for(let i=0; i<2; i++) {
            const date = new Date(now.getFullYear(), now.getMonth() + calendarOffset + i, 1);
            area.appendChild(createMonth(date, cachedDeadlines));
        }
    }

    function createMonth(date, deadlines) {
        const box = document.createElement('div'); box.className = 'month-box';
        box.innerHTML = `<h4 style="text-align:center;">${date.toLocaleString('default', { month: 'long', year: 'numeric' })}</h4><div class="cal-grid"></div>`;
        const grid = box.querySelector('.cal-grid');
        ['S','M','T','W','T','F','S'].forEach(d => grid.innerHTML += `<div style="font-size:0.7rem; font-weight:bold; color:#888; text-align:center;">${d}</div>`);
        const firstDay = new Date(date.getFullYear(), date.getMonth(), 1).getDay();
        const daysInMonth = new Date(date.getFullYear(), date.getMonth()+1, 0).getDate();
        for(let i=0; i<firstDay; i++) grid.appendChild(document.createElement('div'));
        for(let d=1; d<=daysInMonth; d++) {
            const dObj = new Date(date.getFullYear(), date.getMonth(), d);
            grid.appendChild(createDayEl(dObj, deadlines));
        }
        return box;
    }

    function createDayEl(date, deadlines) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        const dStr = `${year}-${month}-${day}`;
        const now = new Date();
        const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        const matches = deadlines.filter(dl => dl.deadline === dStr);
        const isToday = dStr === todayStr;
        const el = document.createElement('div');
        el.className = `cal-day ${matches.length ? 'has-deadline' : ''} ${isToday ? 'today' : ''}`;
        el.innerHTML = `<span>${date.getDate()}</span>${matches.length ? '<div class="dot"></div>' : ''}`;
        if (matches.length) {
            el.onclick = (e) => {
                const tip = document.createElement('div'); tip.className = 'deadline-popup';
                tip.innerText = matches.map(m => `[${m.units?.name}] ${m.name}`).join('\n');
                document.body.appendChild(tip);
                tip.style.left = `${e.pageX}px`; tip.style.top = `${e.pageY}px`;
                setTimeout(() => tip.remove(), 3000);
            };
        }
        return el;
    }

    // --- UNIT EDITING (ADMIN ONLY) ---
    function editUnitInline(id, oldName, oldImg) {
        const card = document.getElementById(`unit-card-${id}`);
        card.innerHTML = `
            <div style="padding:20px; display:flex; flex-direction:column; gap:10px;">
                <label style="font-size:11px; font-weight:bold; color:#666;">UNIT NAME</label>
                <input type="text" id="edit-name-${id}" value="${oldName}" style="width:100%; padding:8px; border:1px solid #ddd; border-radius:4px;">
                <label style="font-size:11px; font-weight:bold; color:#666;">IMAGE URL</label>
                <input type="text" id="edit-img-${id}" value="${oldImg}" style="width:100%; padding:8px; border:1px solid #ddd; border-radius:4px;">
                <div style="display:flex; gap:5px; margin-top:10px;">
                    <button class="btn-action btn-save" style="flex:1" onclick="saveUnitEdit('${id}')">Save</button>
                    <button class="btn-action btn-danger" style="flex:1" onclick="deleteUnit('${id}')">Delete</button>
                    <button class="btn-action" style="flex:1" onclick="init()">Cancel</button>
                </div>
            </div>
        `;
    }

    async function saveUnitEdit(id) {
        const name = document.getElementById(`edit-name-${id}`).value;
        const header_image_url = document.getElementById(`edit-img-${id}`).value;
        if(!name) return;
        await client.from('units').update({ name, header_image_url }).eq('id', id);
        init();
    }

    async function deleteUnit(id) {
        if(confirm("Are you sure?")) { await client.from('units').delete().eq('id', id); init(); }
    }

    function createNewUnit() {
        const placeholder = document.getElementById('add-unit-placeholder');
        placeholder.onclick = null;
        placeholder.style.border = "1px solid #ddd";
        placeholder.style.background = "white";
        placeholder.innerHTML = `
            <div style="padding:20px; width:100%; display:flex; flex-direction:column; gap:10px; cursor:default;" onclick="event.stopPropagation()">
                <strong style="color:var(--primary)">New Unit</strong>
                <input type="text" id="new-unit-name" placeholder="Unit Name" style="padding:8px; border:1px solid #ddd; border-radius:4px;">
                <input type="text" id="new-unit-img" placeholder="Header Image URL" value="https://via.placeholder.com/400x200" style="padding:8px; border:1px solid #ddd; border-radius:4px;">
                <div style="display:flex; gap:5px;">
                    <button class="btn-action btn-save" style="flex:1" onclick="saveNewUnit()">Create</button>
                    <button class="btn-action" style="flex:1" onclick="init()">Cancel</button>
                </div>
            </div>
        `;
    }

    async function saveNewUnit() {
        const name = document.getElementById('new-unit-name').value;
        const img = document.getElementById('new-unit-img').value;
        if (!name) return alert("Please enter a name");
        await client.from('units').insert([{ name, header_image_url: img }]);
        init();
    }

    // --- EDITOR LOGIC (TEACHERS AND ADMINS) ---
    function showOverview() {
        currentUnitId = null;
        document.getElementById('unit-view').classList.remove('hidden');
        document.getElementById('detail-view').classList.add('hidden');
        init();
    }

    async function openEditor(id) {
        currentUnitId = id;
        document.getElementById('unit-view').classList.add('hidden');
        document.getElementById('detail-view').classList.remove('hidden');
        document.getElementById('editor-content').innerHTML = "Loading...";
        await refreshEditor();
    }

    async function refreshEditor() {
        if(!currentUnitId) return;
        try {
            const { data: unit } = await client.from('units').select('*').eq('id', currentUnitId).single();
            const { data: tabs } = await client.from('lectures')
                .select('*, resources(*)')
                .eq('unit_id', currentUnitId)
                .order('sort_order', { ascending: true });
            const { data: genRes } = await client.from('resources').select('*').eq('unit_id', currentUnitId).is('lecture_id', null);
            const sortedGen = (genRes || []).sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));

            document.getElementById('editor-content').innerHTML = `
                <h2>Editing: ${unit.name}</h2>
                <div style="margin-bottom:20px;">
                    <strong>General Resources</strong> <button class="btn-action" onclick="showResInput('gen-list', 'null')">+ Add</button>
                    <div id="gen-list" class="res-sort-zone">${sortedGen.map(r => renderResourceRow(r)).join('')}</div>
                </div>
                <hr>
                <h3>Tabs / Folders (Drag to Reorder)</h3>
                <button class="btn-action btn-save" style="margin-bottom:15px;" onclick="addDraftTab()">+ Add New Tab</button>
                <div id="tabs-container" class="tab-sort-zone">
                    ${tabs.map(t => {
                        const sortedTabRes = (t.resources || []).sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
                        return renderTabFolder(t, sortedTabRes);
                    }).join('')}
                </div>
            `;
            setupResourceSort();
            setupTabSort();
        } catch (e) { console.error(e); }
    }

    function renderResourceRow(r) {
        const hiddenStatus = r.is_hidden ? 'Show' : 'Hide';
        const opacity = r.is_hidden ? '0.4' : '1';
        const icon = r.is_hidden ? '👁️‍🗨️' : '👁️';
        return `<div class="item-row" data-id="${r.id}" id="res-row-${r.id}" style="opacity: ${opacity}">
            <span style="color:#999; margin-right:8px;">☰</span>
            <span style="flex-grow:1">${r.name} ${r.is_hidden ? '<small>(Hidden)</small>' : ''}</span>
            <button class="btn-action" onclick="toggleVisibility('${r.id}', ${r.is_hidden})">${icon} ${hiddenStatus}</button>
            <button class="btn-action" onclick="startEditRes('${r.id}', '${r.name}', '${r.url}')">Edit</button>
            <button class="btn-action" onclick="deleteRes('${r.id}')" style="color:red">Remove</button>
        </div>`;
    }

    async function toggleVisibility(id, currentHiddenStatus) {
        await client.from('resources').update({ is_hidden: !currentHiddenStatus }).eq('id', id);
        refreshEditor();
    }

    function startEditRes(id, n, u) {
        const r = document.getElementById(`res-row-${id}`);
        r.innerHTML = `<input id="rn-${id}" value="${n}" style="flex:1"> <input id="ru-${id}" value="${u}" style="flex:1"> 
        <button class="btn-save" onclick="saveResEdit('${id}')">Save</button>
        <button class="btn-action" onclick="refreshEditor()">Cancel</button>`;
    }

    async function saveResEdit(id) {
        const name = document.getElementById(`rn-${id}`).value;
        const url = document.getElementById(`ru-${id}`).value;
        await client.from('resources').update({ name, url }).eq('id', id);
        refreshEditor();
    }

    function renderTabFolder(t, sortedResources) {
        const isAsmt = t.type === 'assessment';
        let urgentClass = "";
        if(isAsmt && t.deadline) {
            const diff = (new Date(t.deadline) - new Date()) / 86400000;
            if(diff <= 7 && diff >= -1) urgentClass = "urgent";
        }
        return `<div class="tab-block" id="tab-${t.id}">
            <div class="tab-header ${isAsmt ? 'type-assessment' : 'type-lecture'} ${urgentClass}" onclick="toggleTab('${t.id}')">
                <span style="flex-grow:1"><strong>${t.name}</strong> ${(isAsmt && t.deadline) ? ' (Due: '+t.deadline+')' : ''}</span>
                <div onclick="event.stopPropagation()" style="display:flex; gap:5px; align-items:center;">
                    ${isAsmt ? `<input type="date" value="${t.deadline||''}" onchange="updateDeadline('${t.id}', this.value)">` : ''}
                    <button class="btn-action" onclick="startEditTab('${t.id}', '${t.name}', '${t.type}')">Edit</button>
                    <button class="btn-action" onclick="deleteTab('${t.id}')" style="color:red">×</button>
                </div>
            </div>
            <div id="content-${t.id}" class="hidden" style="padding:15px; border-top:1px solid #eee;">
                <div id="res-list-${t.id}" class="res-sort-zone">${(sortedResources||[]).map(r => renderResourceRow(r)).join('')}</div>
                <button class="btn-action" style="margin-top:10px" onclick="showResInput('res-list-${t.id}', '${t.id}')">+ Add Resource</button>
            </div>
        </div>`;
    }

    function setupTabSort() {
        const el = document.getElementById('tabs-container');
        if(!el) return;
        Sortable.create(el, {
            animation: 150, handle: '.tab-header',
            onEnd: async () => {
                const blocks = Array.from(el.querySelectorAll('.tab-block'));
                for (let i = 0; i < blocks.length; i++) {
                    await client.from('lectures').update({ sort_order: i }).eq('id', blocks[i].id.replace('tab-', ''));
                }
            }
        });
    }

    function setupResourceSort() {
        document.querySelectorAll('.res-sort-zone').forEach(el => {
            Sortable.create(el, {
                animation: 150,
                onEnd: async () => {
                    const rows = Array.from(el.querySelectorAll('.item-row'));
                    for (let i = 0; i < rows.length; i++) {
                        await client.from('resources').update({ sort_order: i }).eq('id', rows[i].dataset.id);
                    }
                }
            });
        });
    }

    async function saveR(lecId) {
        const n = document.getElementById('r-n').value, u = document.getElementById('r-u').value;
        const lecture_id = (lecId === 'null' || !lecId) ? null : lecId;
        await client.from('resources').insert([{ name: n, url: u, unit_id: currentUnitId, lecture_id, is_hidden: false }]);
        refreshEditor();
    }

    async function addDraftTab() { await client.from('lectures').insert([{ name: "New Tab", type: "lecture", unit_id: currentUnitId }]); refreshEditor(); }
    async function updateDeadline(id, val) { await client.from('lectures').update({ deadline: val }).eq('id', id); refreshEditor(); }
    async function deleteTab(id) { if(confirm("Delete?")) { await client.from('lectures').delete().eq('id', id); refreshEditor(); } }
    async function deleteRes(id) { if(confirm("Delete?")) { await client.from('resources').delete().eq('id', id); refreshEditor(); } }
    function toggleTab(id) { document.getElementById(`content-${id}`).classList.toggle('hidden'); }
    function showResInput(listId, lecId) {
        const div = document.createElement('div'); div.className = 'item-row';
        div.innerHTML = `<input id="r-n" placeholder="Name"> <input id="r-u" placeholder="URL"> <button class="btn-save" onclick="saveR('${lecId}')">OK</button>`;
        document.getElementById(listId).appendChild(div);
    }

    function startEditTab(id, n, t) {
        const block = document.getElementById(`tab-${id}`);
        const h = block.querySelector(`.tab-header`);
        h.onclick = null; h.style.cursor = 'default';
        h.innerHTML = `<input id="en-${id}" value="${n}"> <select id="et-${id}">
            <option value="lecture" ${t==='lecture'?'selected':''}>Lecture</option>
            <option value="assessment" ${t==='assessment'?'selected':''}>Assessment</option>
        </select><button onclick="saveTabEdit('${id}')">Save</button>`;
    }
    async function saveTabEdit(id) {
        const name = document.getElementById(`en-${id}`).value, type = document.getElementById(`et-${id}`).value;
        await client.from('lectures').update({ name, type }).eq('id', id); refreshEditor();
    }

    function toggleSidebar() { document.getElementById('student-manager').classList.toggle('open'); }
    
    // --- SYSTEM MANAGEMENT (ADMIN ONLY) ---
    async function loadMgr() {
        const { data: users } = await client.from('student_accounts').select('*').order('username');
        const { data: teachers } = await client.from('teacher_accounts').select('*').order('username'); // Fetch Teachers
        const { data: units } = await client.from('units').select('id, name');
        const { data: groups } = await client.from('groups').select('*').order('created_at', {ascending: false});
        
        const { data: uLinks } = await client.from('user_group_membership').select('*, student_accounts(username)');
        const { data: tLinks } = await client.from('teacher_group_membership').select('*, teacher_accounts(username)'); // Teachers in Groups
        const { data: gLinks } = await client.from('unit_group_access').select('*, units(name)');
        
        // Render Libraries
        document.getElementById('lib-teachers').innerHTML = (teachers || []).map(t => `<div class="mini-tag" data-id="${t.id}" data-type="teacher">${t.username} <span onclick="deleteTeacher('${t.id}')">×</span></div>`).join('');
        document.getElementById('lib-students').innerHTML = (users || []).map(u => `<div class="mini-tag" data-id="${u.id}" data-type="student">${u.username} <span onclick="deleteUser('${u.id}')">×</span></div>`).join('');
        document.getElementById('lib-units').innerHTML = (units || []).map(u => `<div class="mini-tag" data-id="${u.id}" data-type="unit">${u.name}</div>`).join('');
        
        const grid = document.getElementById('mgr-groups');
        grid.innerHTML = (groups || []).map(g => {
            const gUsers = (uLinks || []).filter(l => l.group_id === g.id);
            const gTeachers = (tLinks || []).filter(l => l.group_id === g.id); // Filter teachers
            const gUnits = (gLinks || []).filter(l => l.group_id === g.id);
            return `<div class="group-card" id="g-card-${g.id}">
                <div class="group-header" id="g-header-${g.id}">
                    <span style="font-weight:bold;">${g.name}</span>
                    <div style="display:flex; gap:5px; align-items:center;">
                        <button class="btn-action" style="padding:2px 5px; font-size:10px;" onclick="editGroupName('${g.id}', '${g.name.replace(/'/g, "\\'")}')">Edit</button>
                        <button onclick="deleteGroup('${g.id}')" style="background:transparent; border:none; color:white; cursor:pointer;">×</button>
                    </div>
                </div>
                <div class="zone" data-group-id="${g.id}" data-zone-type="unit"><div class="zone-label">Units</div><div class="tag-container drop-zone">${gUnits.map(ul => `<div class="mini-tag">${ul.units?.name} <span onclick="removeUnitLink('${g.id}','${ul.unit_id}')">×</span></div>`).join('')}</div></div>
                <div class="zone" data-group-id="${g.id}" data-zone-type="teacher"><div class="zone-label" style="color:#2e7d32;">Teachers</div><div class="tag-container drop-zone">${gTeachers.map(tl => `<div class="mini-tag">${tl.teacher_accounts?.username} <span onclick="removeTeacherLink('${g.id}','${tl.teacher_id}')">×</span></div>`).join('')}</div></div>
                <div class="zone" data-group-id="${g.id}" data-zone-type="student"><div class="zone-label">Students</div><div class="tag-container drop-zone">${gUsers.map(ul => `<div class="mini-tag">${ul.student_accounts?.username} <span onclick="removeUserLink('${g.id}','${ul.user_id}')">×</span></div>`).join('')}</div></div>
            </div>`;
        }).join('');
        setupDrag();
    }

    function setupDrag() {
        Sortable.create(document.getElementById('lib-teachers'), { group: { name: 'shared', pull: 'clone', put: false }, sort: false });
        Sortable.create(document.getElementById('lib-students'), { group: { name: 'shared', pull: 'clone', put: false }, sort: false });
        Sortable.create(document.getElementById('lib-units'), { group: { name: 'shared', pull: 'clone', put: false }, sort: false });
        document.querySelectorAll('.drop-zone').forEach(el => {
            const zType = el.closest('.zone').dataset.zoneType;
            const gid = el.closest('.zone').dataset.groupId;
            Sortable.create(el, { group: 'shared', onAdd: async (evt) => {
                const id = evt.item.dataset.id;
                if (evt.item.dataset.type !== zType) { evt.item.remove(); return; }
                
                if (zType === 'student') await client.from('user_group_membership').upsert({ group_id: gid, user_id: id });
                else if (zType === 'teacher') await client.from('teacher_group_membership').upsert({ group_id: gid, teacher_id: id }); // NEW
                else await client.from('unit_group_access').upsert({ group_id: gid, unit_id: id });
                
                loadMgr();
            }});
        });
    }

    function addNewGroup() {
        const grid = document.getElementById('mgr-groups');
        const tempId = 'temp-' + Date.now();
        const tempCard = document.createElement('div');
        tempCard.className = 'group-card';
        tempCard.id = tempId;
        tempCard.innerHTML = `
            <div class="group-header" style="background:#2e7d32;">
                <input id="new-g-input" placeholder="Enter Group Name..." style="width:70%; padding:4px; font-size:12px; border-radius:4px; border:none;">
                <button class="btn-save" style="padding:4px 8px; font-size:11px; background:white; color:#2e7d32; border:none; border-radius:4px; font-weight:bold; cursor:pointer;" onclick="confirmNewGroup('${tempId}')">OK</button>
            </div>
            <div style="padding:20px; text-align:center; color:#999; font-size:12px;">Complete name to enable drag & drop</div>
        `;
        grid.prepend(tempCard);
        document.getElementById('new-g-input').focus();
    }

    async function confirmNewGroup(tempId) {
        const nameInput = document.getElementById('new-g-input');
        const name = nameInput.value.trim() || "Untitled Group";
        const { error } = await client.from('groups').insert([{ name: name }]);
        if (error) { console.error(error); alert("Error creating group"); }
        loadMgr();
    }

    function editGroupName(id, oldName) {
        const header = document.getElementById(`g-header-${id}`);
        header.innerHTML = `
            <input id="edit-g-input-${id}" value="${oldName}" style="width:70%; padding:2px; font-size:12px; border-radius:4px; border:none;">
            <button class="btn-save" style="padding:2px 5px; font-size:10px" onclick="saveGroupName('${id}')">Save</button>
        `;
        document.getElementById(`edit-g-input-${id}`).focus();
    }

    async function saveGroupName(id) {
        const newName = document.getElementById(`edit-g-input-${id}`).value.trim();
        if (newName) { await client.from('groups').update({ name: newName }).eq('id', id); }
        loadMgr();
    }

    async function deleteGroup(id) { if(confirm("Delete Group?")) { await client.from('groups').delete().eq('id', id); loadMgr(); } }
    
    // CRUD ACTIONS
    async function addTeacher() { const u = document.getElementById('t-name').value, p = document.getElementById('t-pass').value; if(u && p) { await client.from('teacher_accounts').insert([{ username: u, password: p }]); loadMgr(); } }
    async function addUser() { const u = document.getElementById('u-name').value, p = document.getElementById('u-pass').value; if(u && p) { await client.from('student_accounts').insert([{ username: u, password: p }]); loadMgr(); } }
    
    async function deleteTeacher(id) { await client.from('teacher_accounts').delete().eq('id', id); loadMgr(); }
    async function deleteUser(id) { await client.from('student_accounts').delete().eq('id', id); loadMgr(); }
    
    async function removeTeacherLink(gid, tid) { await client.from('teacher_group_membership').delete().eq('group_id', gid).eq('teacher_id', tid); loadMgr(); }
    async function removeUserLink(gid, uid) { await client.from('user_group_membership').delete().eq('group_id', gid).eq('user_id', uid); loadMgr(); }
    async function removeUnitLink(gid, uid) { await client.from('unit_group_access').delete().eq('group_id', gid).eq('unit_id', uid); loadMgr(); }
    
    async function handleExcelUpload() {
        const fileInput = document.getElementById('excel-file');
        if (!fileInput.files.length) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
            const students = rows.filter(r => r[0] && r[1]).map(r => ({ username: String(r[0]), password: String(r[1]) }));
            await client.from('student_accounts').upsert(students, { onConflict: 'username' });
            loadMgr();
        };
        reader.readAsArrayBuffer(fileInput.files[0]);
    }
</script>
</body>
</html>
