<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Teacher Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.13.0/dist/av-min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: Arial; margin: 20px; }
    .section { margin-bottom: 20px; padding: 10px; border: 1px solid #999; }
    button { margin: 5px; padding: 8px 12px; }
    .option {
      padding: 8px;
      margin: 6px 0;
      background: #f1f1f1;
      border-radius: 4px;
      border-left: 4px solid #6c757d;
    }
    .correct-answer {
      border-left-color: #28a745;
      background-color: #d4edda;
      font-weight: bold;
    }
    #student-lists {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 20px;
    }
    .option-students {
      flex: 1;
      min-width: 120px;
      background: #f8f9fa;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #dee2e6;
    }
    .option-label {
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 14px;
      display: block;
    }
    .students-names {
      font-size: 13px;
      color: #495057;
    }
    canvas { margin-top: 20px; display: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f8f9fa; }
    tr.top3 { background-color: #fffde7; }

    #live-stats {
      margin: 15px 0;
      padding: 12px;
      background: #f0f8ff;
      border-radius: 6px;
      border: 1px solid #cce7ff;
    }
  </style>
</head>

<body>

<div id="live-stats">
  <h3>👥 Live Answer Status</h3>
  <p><strong>Current Question:</strong> <span id="current-q-display">Loading...</span></p>
  <p><strong>Students responded:</strong> <span id="response-count">0</span></p>
  <p><strong>Usernames:</strong> <span id="responded-users">—</span></p>
</div>

<div class="section">
  <h2>Teacher Control Panel</h2>
  <div id="quiz-display">Loading...</div>

  <div>
    <button onclick="startQuiz()">▶ Start Quiz</button>
    <button onclick="showAnswer()">👁️ Show Answer & Stats</button>
    <button onclick="nextQuestion()">⏭️ Next Question</button>
    <button onclick="finishQuiz()">⏹️ Finish Quiz</button>
  </div>

  <canvas id="statsChart" width="700" height="350"></canvas>
  <div id="student-lists"></div>
</div>

<div class="section">
  <h3>Import Questions from Excel</h3>
  <p>Format: A = Question | B = Correct | C/D/E = Wrong</p>
  <input type="file" id="excelFile" accept=".xlsx,.xls" />
  <button onclick="importExcel()">Import to LeanCloud</button>
  <div id="import-status"></div>
</div>

<script>
  AV.init({
    appId: "xYMCd0tsKLFbIFffaGAJ1i8b-gzGzoHsz",
    appKey: "V047I9XiABOAH3zA0dw4ayo8",
    serverURLs: "https://xymcd0tsklfbiffagaj1i8b.lc-cn-n1-shared.com"
  });

  let chart = null;
  const teacherShuffledCache = {};

  /* ==============================
     SAFE EXCEL IMPORT (FIXED)
     ============================== */
  async function importExcel() {
    const file = document.getElementById('excelFile').files[0];
    if (!file) {
      alert("Please select an Excel file.");
      return;
    }

    const statusEl = document.getElementById('import-status');
    statusEl.innerText = "📥 Importing... Please wait";

    try {
      const data = await file.arrayBuffer();
      const workbook = XLSX.read(data, { type: 'array' });
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

      let order = (await new AV.Query('Question').count()) + 1;
      const objects = [];

      rows.forEach((row, idx) => {
        if (!row || !row[0] || !row[1]) return;

        const questionText = String(row[0]).trim();
        const correct = String(row[1]).trim();
        if (!questionText || !correct) return;

        const distractors = [row[2], row[3], row[4]]
          .filter(x => x !== undefined && x !== null && String(x).trim() !== "")
          .map(x => String(x).trim());

        const q = new AV.Object('Question');
        q.set('text', questionText);
        q.set('correct', correct);
        q.set('distractors', distractors);
        q.set('order', order++);

        objects.push(q);
      });

      if (objects.length === 0) {
        statusEl.innerText = "⚠️ No valid questions found.";
        return;
      }

      /* 🔥 BATCH SAVE (CRITICAL FIX) */
      const batchSize = 50;
      for (let i = 0; i < objects.length; i += batchSize) {
        await AV.Object.saveAll(objects.slice(i, i + batchSize));
      }

      statusEl.innerText = `✅ Import successful! (${objects.length} questions)`;
      loadQuizState();

    } catch (err) {
      console.error(err);
      statusEl.innerHTML = `<span style="color:red;">❌ Import failed: ${err.message}</span>`;
    }
  }

  /* ==============================
     EVERYTHING BELOW IS UNCHANGED
     ============================== */

  async function fetchLiveStats() {
    try {
      const state = await new AV.Query('QuizState').first();
      if (!state || state.get('status') !== 'question') {
        document.getElementById('current-q-display').textContent = 'Not active';
        document.getElementById('response-count').textContent = '0';
        document.getElementById('responded-users').textContent = '—';
        return;
      }

      const qIdx = state.get('currentQIndex');
      document.getElementById('current-q-display').textContent = `Question #${qIdx + 1}`;

      const answers = await new AV.Query('StudentAnswer')
        .equalTo('qIndex', qIdx)
        .select(['studentId'])
        .find();

      const users = [...new Set(answers.map(a => a.get('studentId')).filter(Boolean))];
      document.getElementById('response-count').textContent = users.length;
      document.getElementById('responded-users').textContent = users.join(', ') || '—';

    } catch {
      document.getElementById('responded-users').textContent = '⚠️ Error';
    }
  }

  setInterval(fetchLiveStats, 3000);

  function shuffleOptions(correct, distractors) {
    return [correct, ...distractors].sort(() => Math.random() - 0.5);
  }

  async function loadQuizState() {
    const state = await new AV.Query('QuizState').first();
    if (!state) return;

    const status = state.get('status');
    const qIndex = state.get('currentQIndex');

    if (status === 'waiting') {
      document.getElementById('quiz-display').innerHTML = "<em>Quiz not started.</em>";
      return;
    }

    if (status === 'finished') {
      const total = await new AV.Query('Question').count();
      if (total > 0) await showFinalReport(total);
      return;
    }

    const q = await new AV.Query('Question').equalTo('order', qIndex + 1).first();
    if (!q) return;

    const correct = q.get('correct');
    const distractors = q.get('distractors') || [];

    if (!teacherShuffledCache[qIndex]) {
      teacherShuffledCache[qIndex] = shuffleOptions(correct, distractors);
    }

    const options = teacherShuffledCache[qIndex];
    document.getElementById('quiz-display').innerHTML =
      `<h3>${q.get('text')}</h3>` +
      options.map((o, i) => `<div class="option">${['A','B','C','D'][i]}. ${o}</div>`).join('');
  }

  function startQuiz() { updateState('question', 0); }
  function showAnswer() { updateState('revealed', 0); }
  function nextQuestion() { updateState('question', 1); }
  function finishQuiz() { updateState('finished', 0); }

  async function updateState(status, delta) {
    const s = await new AV.Query('QuizState').first();
    if (!s) return;
    s.set('status', status);
    s.set('currentQIndex', Math.max(0, s.get('currentQIndex') + delta));
    await s.save();
    loadQuizState();
  }

  loadQuizState();
</script>

</body>
</html>
