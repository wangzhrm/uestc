<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Teacher Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.13.0/dist/av-min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: Arial; margin: 20px; }
    .section { margin-bottom: 20px; padding: 10px; border: 1px solid #999; }
    button { margin: 5px; padding: 8px 12px; }
    .option {
      padding: 8px;
      margin: 6px 0;
      background: #f1f1f1;
      border-radius: 4px;
      border-left: 4px solid #6c757d;
    }
    .correct-answer {
      border-left-color: #28a745;
      background-color: #d4edda;
      font-weight: bold;
    }
    #student-lists {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 20px;
    }
    .option-students {
      flex: 1;
      min-width: 120px;
      background: #f8f9fa;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #dee2e6;
    }
    .option-label { font-weight: bold; }
    canvas { margin-top: 20px; display: none; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 8px; }
    th { background-color: #f8f9fa; }
    tr.top3 { background-color: #fffde7; }

    #live-stats {
      margin-bottom: 15px;
      padding: 10px;
      background: #f0f8ff;
      border-radius: 6px;
      border: 1px solid #cce7ff;
    }
  </style>
</head>

<body>

<div id="live-stats">
  <h3>👥 Live Answer Status</h3>
  <p><strong>Current Question:</strong> <span id="current-q-display">—</span></p>
  <p><strong>Students responded:</strong> <span id="response-count">0</span></p>
  <p><strong>Usernames:</strong> <span id="responded-users">—</span></p>
</div>

<div class="section">
  <h2>Teacher Control Panel</h2>
  <div id="quiz-display">Loading...</div>

  <button onclick="startQuiz()">▶ Start Quiz</button>
  <button onclick="showAnswer()">👁️ Show Answer</button>
  <button onclick="nextQuestion()">⏭️ Next Question</button>
  <button onclick="finishQuiz()">⏹️ Finish Quiz</button>

  <canvas id="statsChart" width="700" height="350"></canvas>
  <div id="student-lists"></div>
</div>

<div class="section">
  <h3>Import Questions from Excel</h3>
  <p>A = Question | B = Correct | C/D/E = Wrong</p>
  <input type="file" id="excelFile" accept=".xlsx,.xls">
  <button onclick="importExcel()">Import to LeanCloud</button>
  <div id="import-status"></div>
</div>

<!-- ⚠️ DANGER ZONE -->
<div class="section">
  <h3>Danger Zone</h3>
  <button onclick="clearAllData()" style="background:#dc3545;color:white;">
    🗑️ Clear All Questions, Answers & Reset Quiz
  </button>
  <div id="clear-status"></div>
</div>

<script>
/* ================== INIT ================== */
AV.init({
  appId: "xYMCd0tsKLFbIFffaGAJ1i8b-gzGzoHsz",
  appKey: "V047I9XiABOAH3zA0dw4ayo8",
  serverURLs: "https://xymcd0tsklfbiffagaj1i8b.lc-cn-n1-shared.com"
});

let chart = null;
const teacherShuffledCache = {};

/* =============== UTILITIES =============== */
async function getNextOrder() {
  const q = new AV.Query('Question');
  q.descending('order');
  q.limit(1);
  const last = await q.first();
  return last ? last.get('order') + 1 : 1;
}

/* =============== EXCEL IMPORT =============== */
async function importExcel() {
  const file = document.getElementById('excelFile').files[0];
  if (!file) return alert("Select an Excel file.");

  const status = document.getElementById('import-status');
  status.innerText = "📥 Importing...";

  try {
    const data = await file.arrayBuffer();
    const workbook = XLSX.read(data, { type: 'array' });
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });

    let order = await getNextOrder();
    const objects = [];

    rows.forEach(row => {
      if (!row || !row[0] || !row[1]) return;

      const q = new AV.Object('Question');
      q.set('text', String(row[0]).trim());
      q.set('correct', String(row[1]).trim());
      q.set('distractors',
        [row[2], row[3], row[4]]
          .filter(x => x)
          .map(x => String(x).trim())
      );
      q.set('order', order++);
      objects.push(q);
    });

    if (!objects.length) {
      status.innerText = "⚠️ No valid questions.";
      return;
    }

    for (let i = 0; i < objects.length; i += 50) {
      await AV.Object.saveAll(objects.slice(i, i + 50));
    }

    status.innerText = `✅ Imported ${objects.length} questions.`;
    loadQuizState();

  } catch (err) {
    console.error(err);
    status.innerHTML = `<span style="color:red;">❌ ${err.message}</span>`;
  }
}

/* =============== DANGER ZONE =============== */
async function clearAllData() {
  if (!confirm("⚠️ This will DELETE all data.\nContinue?")) return;

  const status = document.getElementById('clear-status');
  status.innerText = "🧹 Clearing data...";

  try {
    for (const cls of ['Question', 'StudentAnswer']) {
      let q;
      do {
        q = await new AV.Query(cls).limit(1000).find();
        if (q.length) await AV.Object.destroyAll(q);
      } while (q.length === 1000);
    }

    let state = await new AV.Query('QuizState').first();
    if (!state) state = new AV.Object('QuizState');
    state.set('status', 'waiting');
    state.set('currentQIndex', 0);
    await state.save();

    Object.keys(teacherShuffledCache).forEach(k => delete teacherShuffledCache[k]);
    if (chart) chart.destroy();

    status.innerText = "✅ All data cleared.";
    loadQuizState();

  } catch (err) {
    console.error(err);
    status.innerHTML = `<span style="color:red;">❌ ${err.message}</span>`;
  }
}

/* =============== QUIZ CONTROL =============== */
function startQuiz() { updateState('question', 0); }
function showAnswer() { updateState('revealed', 0); }
function nextQuestion() { updateState('question', 1); }
function finishQuiz() { updateState('finished', 0); }

async function updateState(status, delta) {
  const s = await new AV.Query('QuizState').first();
  if (!s) return;
  s.set('status', status);
  s.set('currentQIndex', Math.max(0, s.get('currentQIndex') + delta));
  await s.save();
  loadQuizState();
}

/* =============== LOAD STATE =============== */
async function loadQuizState() {
  const state = await new AV.Query('QuizState').first();
  if (!state) return;

  if (state.get('status') === 'waiting') {
    document.getElementById('quiz-display').innerHTML = "<em>Quiz not started.</em>";
    return;
  }

  if (state.get('status') === 'finished') {
    document.getElementById('quiz-display').innerHTML = "<h3>Quiz finished.</h3>";
    return;
  }

  const idx = state.get('currentQIndex');
  const q = await new AV.Query('Question').equalTo('order', idx + 1).first();
  if (!q) return;

  const options = teacherShuffledCache[idx] ||
    (teacherShuffledCache[idx] = [q.get('correct'), ...(q.get('distractors') || [])]
      .sort(() => Math.random() - 0.5));

  document.getElementById('quiz-display').innerHTML =
    `<h3>${q.get('text')}</h3>` +
    options.map((o, i) =>
      `<div class="option">${['A','B','C','D'][i]}. ${o}</div>`
    ).join('');
}

/* =============== LIVE STATS =============== */
async function fetchLiveStats() {
  const state = await new AV.Query('QuizState').first();
  if (!state || state.get('status') !== 'question') return;

  const qIdx = state.get('currentQIndex');
  document.getElementById('current-q-display').innerText = qIdx + 1;

  const answers = await new AV.Query('StudentAnswer')
    .equalTo('qIndex', qIdx)
    .find();

  const users = [...new Set(answers.map(a => a.get('studentId')))];
  document.getElementById('response-count').innerText = users.length;
  document.getElementById('responded-users').innerText = users.join(', ') || '—';
}

setInterval(fetchLiveStats, 3000);
loadQuizState();
</script>

</body>
</html>
