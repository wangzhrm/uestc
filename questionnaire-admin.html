<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Questionnaire Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.15.0/dist/av-min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: #f9f9f9; padding: 20px; display: flex; gap: 20px; }
    .sidebar { width: 300px; background: white; border-radius: 8px; padding: 16px; height: fit-content; }
    .main { flex: 1; background: white; border-radius: 8px; padding: 20px; }
    h1, h2, h3 { margin-bottom: 12px; color: #333; }
    .btn {
      background: #007aff; color: white; border: none; padding: 8px 12px;
      border-radius: 4px; cursor: pointer; font-size: 14px; margin-right: 8px;
    }
    .btn:hover { opacity: 0.9; }
    .btn-danger { background: #ff3b30; }
    .survey-item {
      padding: 10px; margin: 6px 0; background: #f0f0f0; border-radius: 4px;
      cursor: pointer; transition: background 0.2s;
    }
    .survey-item:hover { background: #e0e0e0; }
    .form-group { margin: 12px 0; }
    label { display: block; margin-bottom: 4px; font-weight: bold; }
    input, textarea, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    textarea { min-height: 60px; }
    .question-editor {
      border: 1px solid #ddd; padding: 16px; border-radius: 8px;
      margin: 16px 0; background: #fafafa;
    }
    .option-line { display: flex; gap: 8px; margin: 6px 0; align-items: center; }
    .option-line input { flex: 1; }
    .alert-error { color: red; background: #ffebee; padding: 10px; border-radius: 4px; }
    small { font-size: 0.85em; }
  </style>
</head>
<body>

<div class="sidebar">
  <h2>Surveys</h2>
  <button class="btn" onclick="createNewSurvey()">➕ Create New Survey</button>
  <div id="survey-list">Loading surveys...</div>
</div>

<div class="main">
  <div id="editor">
    <p>Select a survey from the list to edit.</p>
  </div>
</div>

<script>
  // 🔑 Replace with your actual LeanCloud credentials
  const APP_ID = 'htY6FjuugSzKkkI6NKwFqyJb-gzGzoHsz';
  const APP_KEY = '9ZZ31UOLEbw2nyRcYeD0otWj';
  const SERVER_URL = 'https://hty6fjuugszkkki6nkwfqyjb.lc-cn-n1-shared.com';

  AV.init({ appId: APP_ID, appKey: APP_KEY, serverURLs: SERVER_URL });

  let currentSurvey = null;

  function showError(containerId, message) {
    document.getElementById(containerId).innerHTML = `<div class="alert-error">${message}</div>`;
    console.error(message);
  }

  async function loadSurveys() {
    const listEl = document.getElementById('survey-list');
    try {
      const query = new AV.Query('Questionnaire');
      query.addDescending('createdAt');
      query.limit(100);
      const surveys = await query.find();

      if (!surveys || surveys.length === 0) {
        listEl.innerHTML = '<p>No surveys found.</p>';
        return;
      }

      let html = '';
      surveys.forEach(s => {
        const title = s.get('title') || '(Untitled)';
        // Escape special characters safely
        const escapedTitle = String(title).replace(/</g, '&lt;').replace(/>/g, '&gt;');
        html += `
          <div class="survey-item" data-id="${s.id}" onclick="loadSurvey('${s.id}')">
            ${escapedTitle} <small>(${s.id})</small>
          </div>
        `;
      });
      listEl.innerHTML = html;
    } catch (err) {
      console.error('Failed to load surveys:', err);
      showError('survey-list', '❌ Failed to load surveys. Check console.');
    }
  }

  async function loadSurvey(surveyId) {
    try {
      const surveyObj = AV.Object.createWithoutData('Questionnaire', surveyId);
      await surveyObj.fetch();
      currentSurvey = surveyObj;

      const query = new AV.Query('Question');
      query.equalTo('questionnaire', surveyObj);
      query.addAscending('order');
      const questions = await query.find();

      const title = surveyObj.get('title') || '';
      const escapedTitle = String(title).replace(/</g, '&lt;').replace(/>/g, '&gt;');

      let html = `
        <h2>Editing: ${escapedTitle}</h2>
        <div class="form-group">
          <label>Survey Title</label>
          <input type="text" id="survey-title" value="${escapedTitle}" />
        </div>
        <button class="btn" onclick="saveSurveyTitle()">💾 Save Title</button>
        <hr style="margin:20px 0;">
        <h3>Questions (${questions.length})</h3>
      `;

      questions.forEach(q => {
        html += buildQuestionEditor(q);
      });

      html += `
        <hr>
        <h3>Add New Question</h3>
        ${buildQuestionEditor(null, true)}
      `;
      document.getElementById('editor').innerHTML = html;
    } catch (err) {
      console.error('Load survey error:', err);
      document.getElementById('editor').innerHTML = `<div class="alert-error">Failed to load survey: ${err.message || err}</div>`;
    }
  }

  function escapeHtml(text) {
    if (typeof text !== 'string') return '';
    return text.replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function buildQuestionEditor(questionObj, isNew = false) {
    const q = questionObj || {};
    const id = q.id || 'new_' + Date.now();
    const key = q.get ? escapeHtml(q.get('key') || '') : '';
    const text = q.get ? escapeHtml(q.get('text') || '') : '';
    const type = q.get ? (q.get('type') || 'text') : 'text';
    const options = (q.get ? (q.get('options') || []) : []);
    const order = q.get ? (q.get('order') || 0) : 0;

    let optsHtml = '';
    if (['radio','checkbox','select','scale'].includes(type)) {
      optsHtml = '<div class="options-list">';
      const optList = options.length > 0 ? options : ['Option 1', 'Option 2'];
      optList.forEach(opt => {
        const safeOpt = escapeHtml(String(opt));
        optsHtml += `
          <div class="option-line">
            <input type="text" value="${safeOpt}" placeholder="Option" />
            <button type="button" class="remove-opt" onclick="this.closest('.option-line').remove()">−</button>
          </div>
        `;
      });
      optsHtml += `
        <button type="button" class="btn" style="margin-top:8px;font-size:0.9rem;padding:6px;"
          onclick="addOptionToEditor(this.closest('.question-editor'))">+ Add Option</button>
      </div>
      `;
    }

    return `
      <div class="question-editor" data-id="${id}">
        <div class="form-group">
          <label>Question Key (e.g., Q1)</label>
          <input type="text" value="${key}" class="q-key" placeholder="Q1" />
        </div>
        <div class="form-group">
          <label>Question Text</label>
          <textarea class="q-text">${text}</textarea>
        </div>
        <div class="form-group">
          <label>Type</label>
          <select class="q-type">
            <option value="text" ${type==='text'?'selected':''}>Text</option>
            <option value="number" ${type==='number'?'selected':''}>Number</option>
            <option value="radio" ${type==='radio'?'selected':''}>Single Choice</option>
            <option value="checkbox" ${type==='checkbox'?'selected':''}>Multiple Choice</option>
            <option value="select" ${type==='select'?'selected':''}>Dropdown</option>
            <option value="scale" ${type==='scale'?'selected':''}>Scale (e.g., 1–5)</option>
          </select>
        </div>
        ${optsHtml}
        <div class="form-group">
          <label>Order</label>
          <input type="number" value="${order}" class="q-order" />
        </div>
        ${isNew ? 
          `<button class="btn" onclick="saveNewQuestion(this.closest('.question-editor'))">✅ Save New Question</button>` :
          `<button class="btn" onclick="updateQuestion('${q.id}', this.closest('.question-editor'))">🔄 Update</button>
           <button class="btn btn-danger" onclick="deleteQuestion('${q.id}')">🗑️ Delete</button>`
        }
      </div>
    `;
  }

  function addOptionToEditor(editorEl) {
    const container = editorEl.querySelector('.options-list');
    if (!container) return;
    const newOpt = document.createElement('div');
    newOpt.className = 'option-line';
    newOpt.innerHTML = `
      <input type="text" placeholder="Option" />
      <button type="button" class="remove-opt" onclick="this.closest('.option-line').remove()">−</button>
    `;
    container.appendChild(newOpt);
  }

  async function createNewSurvey() {
    const title = prompt('Enter survey title:');
    if (!title?.trim()) return;
    try {
      const Survey = AV.Object.extend('Questionnaire');
      const survey = new Survey();
      survey.set('title', title.trim());
      await survey.save();
      alert('✅ Survey created!');
      loadSurveys();
      loadSurvey(survey.id);
    } catch (err) {
      alert('❌ Create failed: ' + (err.message || err));
    }
  }

  async function saveSurveyTitle() {
    if (!currentSurvey) { alert('No survey selected'); return; }
    const title = document.getElementById('survey-title').value?.trim();
    if (!title) { alert('Title cannot be empty'); return; }
    try {
      currentSurvey.set('title', title);
      await currentSurvey.save();
      loadSurveys(); // refresh list
      alert('✅ Title saved');
    } catch (err) {
      alert('❌ Save failed: ' + (err.message || err));
    }
  }

  async function saveNewQuestion(editorEl) {
    if (!currentSurvey) { alert('No survey selected'); return; }
    const key = editorEl.querySelector('.q-key').value?.trim();
    const text = editorEl.querySelector('.q-text').value?.trim();
    const type = editorEl.querySelector('.q-type').value;
    const order = parseInt(editorEl.querySelector('.q-order').value) || 0;

    if (!key || !text) { alert('Key and text are required'); return; }

    let options = [];
    if (['radio','checkbox','select','scale'].includes(type)) {
      options = Array.from(editorEl.querySelectorAll('.options-list input'))
        .map(inp => inp.value.trim())
        .filter(v => v);
    }

    try {
      const Question = AV.Object.extend('Question');
      const q = new Question();
      q.set('questionnaire', currentSurvey);
      q.set('key', key);
      q.set('text', text);
      q.set('type', type);
      q.set('options', options);
      q.set('order', order);
      await q.save();
      alert('✅ Question saved');
      loadSurvey(currentSurvey.id);
    } catch (err) {
      alert('❌ Save question failed: ' + (err.message || err));
    }
  }

  async function updateQuestion(id, editorEl) {
    const key = editorEl.querySelector('.q-key').value?.trim();
    const text = editorEl.querySelector('.q-text').value?.trim();
    const type = editorEl.querySelector('.q-type').value;
    const order = parseInt(editorEl.querySelector('.q-order').value) || 0;

    if (!key || !text) { alert('Key and text are required'); return; }

    let options = [];
    if (['radio','checkbox','select','scale'].includes(type)) {
      options = Array.from(editorEl.querySelectorAll('.options-list input'))
        .map(inp => inp.value.trim())
        .filter(v => v);
    }

    try {
      const obj = AV.Object.createWithoutData('Question', id);
      obj.set('key', key);
      obj.set('text', text);
      obj.set('type', type);
      obj.set('options', options);
      obj.set('order', order);
      await obj.save();
      alert('✅ Question updated');
      loadSurvey(currentSurvey.id);
    } catch (err) {
      alert('❌ Update failed: ' + (err.message || err));
    }
  }

  async function deleteQuestion(id) {
    if (!confirm('Are you sure you want to delete this question?')) return;
    try {
      const obj = AV.Object.createWithoutData('Question', id);
      await obj.destroy();
      alert('✅ Question deleted');
      loadSurvey(currentSurvey.id);
    } catch (err) {
      alert('❌ Delete failed: ' + (err.message || err));
    }
  }

  // Expose functions globally for inline handlers
  window.loadSurvey = loadSurvey;
  window.createNewSurvey = createNewSurvey;
  window.saveSurveyTitle = saveSurveyTitle;
  window.saveNewQuestion = saveNewQuestion;
  window.updateQuestion = updateQuestion;
  window.deleteQuestion = deleteQuestion;
  window.addOptionToEditor = addOptionToEditor;

  // Initialize
  document.addEventListener('DOMContentLoaded', () => {
    loadSurveys();
  });
</script>

</body>
</html>
