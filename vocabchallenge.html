<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vocabulary Challenge</title>
  <script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.13.2/dist/av-min.js"></script>
  <style>
    body { font-family: Arial; padding: 15px; }
    #loginSection, #gameSection { width: 100%; }
    #gameSection { display: none; }
    .online-card {
      border: 1px solid #ccc; margin: 8px; padding: 10px;
      background: #f9f9f9; cursor: pointer;
    }
    .online-card.disabled { background: #eee; color: gray; cursor: not-allowed; }
    .challenge-screen, .result-screen { 
      display: none; position: fixed; top:0; left:0; 
      width:100%; height:100%; background:white; z-index:100; padding:20px; 
    }
    .ranking-item { padding: 5px; border-bottom: 1px solid #eee; }
    #gameStatus { font-weight: bold; color: green; }
    #powerUpBtn { margin-top: 10px; background: orange; color: white; padding: 5px 10px; border: none; cursor: pointer; }
    input, button { margin: 5px; padding: 8px; }
  </style>
</head>
<body>

<!-- 🔐 LOGIN SECTION -->
<div id="loginSection">
  <h2>Student Login</h2>
  <input type="text" id="loginUsername" placeholder="Username" /><br>
  <input type="password" id="loginPassword" placeholder="Password" /><br>
  <button onclick="attemptLogin()">Login</button>
  <p id="loginError" style="color:red;"></p>
</div>

<!-- 🎮 GAME SECTION (hidden until login) -->
<div id="gameSection">
  <h2 id="welcome">Welcome, student!</h2>
  <p>Game Status: <span id="gameStatus">Loading...</span></p>

  <h3>Online Students</h3>
  <div id="onlineStudents"></div>

  <h3>Rankings</h3>
  <div id="rankings"></div>

  <button id="powerUpBtn" style="display:none;">Power Me Up!</button>

  <!-- Challenge Screen -->
  <div id="challengeScreen" class="challenge-screen">
    <h2>Vocabulary Challenge</h2>
    <p>Time: <span id="timer">0s</span></p>
    <h3 id="currentWord">Loading...</h3>
    <div id="options"></div>
  </div>

  <!-- Result Screen -->
  <div id="resultScreen" class="result-screen">
    <h2>Challenge Result</h2>
    <p id="resultText"></p>
    <p>Redirecting in <span id="countdown">5</span> seconds...</p>
  </div>
</div>

<script>
  // === Global variables ===
  let currentUser = null;
  let currentChallenge = null;
  let startTime = null;
  let userTime = 0;
  let penalty = 0;
  let timerInterval = null;
  let challengeTimeout = null;

  // === Initialize LeanCloud ===
  AV.init({
    appId: "awUs1OEg2gNP2FbDR0DYZt8O-gzGzoHsz",
    appKey: "SenNF43Fxr0lhQ9whRmeZ6sG",
    serverURL: "https://awus1oeg.lc-cn-n1-shared.com"
  });

  // === Check if already logged in ===
  AV.User.currentAsync().then(user => {
    if (user) {
      currentUser = user;
      showGameUI();
      startGameLogic();
    } else {
      showLoginUI();
    }
  });

  function showLoginUI() {
    document.getElementById('loginSection').style.display = 'block';
    document.getElementById('gameSection').style.display = 'none';
  }

  function showGameUI() {
    document.getElementById('loginSection').style.display = 'none';
    document.getElementById('gameSection').style.display = 'block';
  }

  async function attemptLogin() {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!username || !password) {
      showError("Please enter both username and password.");
      return;
    }

    try {
      const user = await AV.User.logIn(username, password);
      currentUser = user;
      showGameUI();
      startGameLogic();
    } catch (err) {
      console.error(err);
      showError(err.message || "Login failed.");
    }
  }

  function showError(msg) {
    document.getElementById('loginError').textContent = msg;
  }

  // === Game Logic (only runs after login) ===
  function startGameLogic() {
    document.getElementById('welcome').textContent = `Welcome, ${currentUser.get('username')}!`;
    updateUserOnline(true);
    loadGameStatus();
    setInterval(loadGameStatus, 3000);
    loadOnlineStudents();
    loadRankings();
    checkPowerUpEligibility();
    listenForChallenges();

    // Handle browser close / refresh
    window.addEventListener('beforeunload', () => {
      updateUserOnline(false);
    });
  }

  function updateUserOnline(isOnline) {
    if (!currentUser) return;
    currentUser.set('isOnline', isOnline);
    currentUser.set('lastSeen', new Date());
    currentUser.save().catch(console.error);
    if (!isOnline && currentChallenge) {
      updateChallengeStatus('abandoned');
    }
  }

  // ... [REST OF YOUR GAME LOGIC FUNCTIONS FROM PREVIOUS VERSION] ...

  // Paste all functions below here:
  // - loadGameStatus()
  // - loadOnlineStudents()
  // - loadRankings()
  // - challengeStudent()
  // - listenForChallenges()
  // - startVocabChallenge()
  // - showVocab()
  // - finishChallenge()
  // - checkChallengeResult()
  // - showResultScreen()
  // - handleTimeoutLoss()
  // - checkPowerUpEligibility()
  // - requestPowerUp()

  // For brevity, I’ll include them inline below — but in real code, just copy from previous answer.

  // ====================== BEGIN: COPY FROM PREVIOUS STUDENT.JS ======================

  async function loadGameStatus() {
    const query = new AV.Query('GameSettings');
    const settings = await query.first();
    const isActive = settings ? settings.get('isActive') : false;
    document.getElementById('gameStatus').textContent = isActive ? 'ACTIVE' : 'INACTIVE';
    document.getElementById('gameStatus').style.color = isActive ? 'green' : 'red';
  }

  async function loadOnlineStudents() {
    const query = new AV.Query('Student');
    query.equalTo('isOnline', true);
    query.notEqualTo('objectId', currentUser.id);
    const onlineStudents = await query.find();

    const container = document.getElementById('onlineStudents');
    container.innerHTML = '';

    for (const student of onlineStudents) {
      const card = document.createElement('div');
      card.className = 'online-card';
      card.innerHTML = `${student.get('username')} (${student.get('coins')} coins)`;

      if (student.get('currentChallengeId')) {
        card.classList.add('disabled');
      } else {
        card.onclick = () => challengeStudent(student);
      }

      container.appendChild(card);
    }
  }

  async function loadRankings() {
    const query = new AV.Query('Student');
    query.descending('coins');
    const students = await query.find();
    const container = document.getElementById('rankings');
    container.innerHTML = '';
    students.forEach(s => {
      const div = document.createElement('div');
      div.className = 'ranking-item';
      div.textContent = `${s.get('username')}: ${s.get('coins')} coins | W: ${s.get('wins')} L: ${s.get('losses')}`;
      container.appendChild(div);
    });
  }

  async function challengeStudent(targetStudent) {
    const gameQuery = new AV.Query('GameSettings');
    const gameSettings = await gameQuery.first();
    if (!gameSettings || !gameSettings.get('isActive')) {
      alert('Game is not active!');
      return;
    }

    const ChallengeClass = AV.Object.extend('Challenge');
    const challenge = new ChallengeClass();
    challenge.set('challengerId', currentUser.id);
    challenge.set('challengedId', targetStudent.id);
    challenge.set('status', 'pending');

    try {
      await challenge.save();
      currentUser.set('currentChallengeId', challenge.id);
      await currentUser.save();

      targetStudent.set('currentChallengeId', challenge.id);
      await targetStudent.save();

      alert('Challenge sent!');
    } catch (err) {
      console.error(err);
      alert('Failed to send challenge.');
    }
  }

  function listenForChallenges() {
    const query = new AV.Query('Challenge');
    query.equalTo('challengedId', currentUser.id);
    query.equalTo('status', 'pending');
    const subscription = query.subscribe();
    subscription.on('create', async (challenge) => {
      if (confirm(`You've been challenged! Accept?`)) {
        challenge.set('status', 'accepted');
        challenge.set('startTime', new Date());
        await challenge.save();
        startVocabChallenge(challenge);
      } else {
        challenge.set('status', 'surrendered');
        challenge.set('winnerId', challenge.get('challengerId'));
        await challenge.save();

        const winner = AV.Object.createWithoutData('Student', challenge.get('challengerId'));
        const loser = currentUser;
        winner.increment('coins', 3);
        loser.increment('coins', -3);
        loser.increment('losses', 1);
        await AV.Object.saveAll([winner, loser]);

        alert('You surrendered. Lost 3 coins.');
        location.reload();
      }
    });
  }

  async function startVocabChallenge(challenge) {
    currentChallenge = challenge;
    document.getElementById('challengeScreen').style.display = 'block';

    const vocabQuery = new AV.Query('Vocabulary');
    const allVocab = await vocabQuery.find();
    if (allVocab.length < 3) {
      alert('Not enough vocabulary!');
      return;
    }

    const shuffled = [...allVocab].sort(() => 0.5 - Math.random());
    const selected = shuffled.slice(0, 10);
    const wordList = selected.map(v => ({ word: v.get('word'), meaning: v.get('meaning') }));
    challenge.set('vocabList', wordList.map(v => v.word));
    await challenge.save();

    const vocabMap = {};
    wordList.forEach(v => vocabMap[v.word] = v.meaning);

    let currentIndex = 0;
    userTime = 0;
    penalty = 0;
    startTime = Date.now();
    timerInterval = setInterval(() => {
      userTime = Math.floor((Date.now() - startTime + penalty * 1000) / 1000);
      document.getElementById('timer').textContent = userTime + 's';
    }, 1000);

    challengeTimeout = setTimeout(() => {
      if (currentChallenge) handleTimeoutLoss();
    }, 3 * 60 * 1000);

    showVocab(wordList, currentIndex, vocabMap);
  }

  function showVocab(wordList, index, vocabMap) {
    if (index >= wordList.length) {
      finishChallenge();
      return;
    }

    const current = wordList[index];
    const options = [current.meaning];
    const others = wordList.filter(w => w.word !== current.word);
    const shuffled = [...others].sort(() => 0.5 - Math.random());
    options.push(shuffled[0].meaning, shuffled[1].meaning);
    options.sort(() => 0.5 - Math.random());

    document.getElementById('currentWord').textContent = current.word;
    const optionsDiv = document.getElementById('options');
    optionsDiv.innerHTML = '';
    options.forEach(opt => {
      const btn = document.createElement('button');
      btn.style.display = 'block'; btn.style.margin = '5px';
      btn.textContent = opt;
      btn.onclick = () => {
        if (opt === current.meaning) {
          showVocab(wordList, index + 1, vocabMap);
        } else {
          penalty += 5;
          alert('Wrong! +5s penalty.');
        }
      };
      optionsDiv.appendChild(btn);
    });
  }

  async function finishChallenge() {
    clearInterval(timerInterval);
    clearTimeout(challengeTimeout);
    const finalTime = userTime;
    currentChallenge.set(`player${currentChallenge.get('challengerId') === currentUser.id ? '1' : '2'}Time`, finalTime);
    currentChallenge.set('status', 'completed');
    await currentChallenge.save();
    checkChallengeResult();
  }

  async function checkChallengeResult() {
    const challenge = await new AV.Query('Challenge').get(currentChallenge.id);
    const p1Time = challenge.get('player1Time');
    const p2Time = challenge.get('player2Time');

    if (p1Time !== undefined && p2Time !== undefined) {
      showResultScreen(challenge);
    } else {
      setTimeout(() => checkChallengeResult(), 2000);
    }
  }

  async function showResultScreen(challenge) {
    document.getElementById('challengeScreen').style.display = 'none';
    document.getElementById('resultScreen').style.display = 'block';

    const p1Time = challenge.get('player1Time');
    const p2Time = challenge.get('player2Time');
    let resultText = '';
    let winnerId = null;

    if (p1Time === undefined && p2Time === undefined) {
      resultText = "Both timed out. No coins changed.";
    } else if (p1Time === undefined) {
      winnerId = challenge.get('challengedId');
      resultText = `Player 2 wins! (Player 1 timed out)`;
    } else if (p2Time === undefined) {
      winnerId = challenge.get('challengerId');
      resultText = `Player 1 wins! (Player 2 timed out)`;
    } else if (p1Time < p2Time) {
      winnerId = challenge.get('challengerId');
      resultText = `Player 1 wins! (${p1Time}s vs ${p2Time}s)`;
    } else if (p2Time < p1Time) {
      winnerId = challenge.get('challengedId');
      resultText = `Player 2 wins! (${p2Time}s vs ${p1Time}s)`;
    } else {
      resultText = "Tie! No coins changed.";
    }

    challenge.set('winnerId', winnerId);
    await challenge.save();

    if (winnerId) {
      const winner = AV.Object.createWithoutData('Student', winnerId);
      const loserId = winnerId === currentUser.id ?
        (currentUser.id === challenge.get('challengerId') ? challenge.get('challengedId') : challenge.get('challengerId'))
        : currentUser.id;
      const loser = AV.Object.createWithoutData('Student', loserId);

      winner.increment('coins', 5);
      winner.increment('wins', 1);
      loser.increment('coins', -5);
      loser.increment('losses', 1);
      await AV.Object.saveAll([winner, loser]);
    }

    document.getElementById('resultText').textContent = resultText;

    let count = 5;
    const cd = setInterval(() => {
      document.getElementById('countdown').textContent = --count;
      if (count <= 0) {
        clearInterval(cd);
        window.location.reload();
      }
    }, 1000);
  }

  async function handleTimeoutLoss() {
    currentChallenge.set(`player${currentChallenge.get('challengerId') === currentUser.id ? '1' : '2'}Time`, undefined);
    currentChallenge.set('status', 'timeout');
    await currentChallenge.save();
    finishChallenge();
  }

  function checkPowerUpEligibility() {
    if (currentUser.get('coins') < 10) {
      document.getElementById('powerUpBtn').style.display = 'inline-block';
      document.getElementById('powerUpBtn').onclick = requestPowerUp;
    }
  }

  async function requestPowerUp() {
    const PowerUpRequest = AV.Object.extend('PowerUpRequest');
    const req = new PowerUpRequest();
    req.set('userId', currentUser.id);
    req.set('handled', false);
    await req.save();
    alert('Power-up requested! Please wait for admin approval.');
  }

  // ====================== END: GAME LOGIC ======================

</script>
</body>
</html>
