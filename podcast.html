<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Everyday English</title>
  <script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.15.0/dist/av-min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f7f6;
      color: #333;
      margin: 0;
      padding: 12px;
      line-height: 1.5;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding-bottom: 30px;
    } 
    h1 {
      color: #2c3e50;
      text-align: center;
      margin: 10px 0 20px;
      font-size: 1.6rem;
    }

    /* Audio Player */
    #now-playing {
      text-align: center;
      margin: 16px 0 8px;
      font-weight: bold;
      color: #2c3e50;
      display: none;
      font-size: 1.1rem;
    }
    #global-player {
      width: 100%;
      height: 50px;
      border-radius: 6px;
      display: none;
    }
    .loading, .error {
      padding: 16px;
      text-align: center;
      color: #7f8c8d;
      font-size: 0.95rem;
    }
    .error {
      color: #e74c3c;
    }

    /* Podcast Card */
    .podcast-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 16px;
      overflow: hidden;
    }
    .podcast-header {
      padding: 14px 16px;
      background: #3498db;
      color: white;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 1.1rem;
    }
    .podcast-header:hover {
      background: #2980b9;
    }
    .episodes-list {
      display: none;
      padding: 0;
    }
    .episodes-list.active {
      display: block;
    }

    .episode-item {
      padding: 14px 16px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .episode-item:last-child {
      border-bottom: none;
    }
    .episode-item:hover {
      background: #f8fbff;
    }
    .episode-item.active {
      background: #eaf4ff;
      border-left: 3px solid #3498db;
    }

    .episode-info {
      flex: 1;
      min-width: 0;
    }
    .episode-title {
      font-weight: 600;
      margin: 0 0 4px;
      font-size: 1rem;
      word-break: break-word;
      color: #2c3e50;
    }
    .episode-date {
      font-size: 0.8rem;
      color: #7f8c8d;
    }

    .btn-text {
      flex-shrink: 0;
      padding: 6px 12px;
      font-size: 0.85rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #f9f9f9;
      color: #555;
      cursor: pointer;
      display: flex;
      align-items: center;
      height: fit-content;
      margin-top: 2px;
      transition: background-color 0.2s, color 0.2s;
    }
    .btn-text.has-transcript {
      background-color: #e3f2fd;
      color: #1976d2;
      border-color: #bbdefb;
    } 
    .btn-text.has-transcript:hover {
      background-color: #bbdefb;
    }
    .btn-text:not(.has-transcript) {
      color: #ccc;
      cursor: default;
      border-color: #eee;
      background: #fafafa;
    }

    #transcript-area {
      display: none;
      margin-top: 15px;
      padding: 15px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    #transcript-area h3 {
      margin-top: 0;
      padding-bottom: 5px;
      border-bottom: 1px solid #eee;
    }

    #locked-view, #unlocked-view {
      margin-top: 10px;
    }

    #srt-upload {
      margin-top: 6px;
      padding: 4px;
      width: 100%;
      font-size: 0.95rem;
    }

    #upload-status {
      margin-top: 8px;
      font-size: 0.9rem;
      color: #7f8c8d;
    }

    /* Subtitle Display Window */
    #sync-transcript {
      display: block;
      margin-top: 15px;
      background: #f9f9f9;
      padding: 12px;
      border-radius: 6px;
      height: 320px;
      overflow-y: auto;
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .btn-edit {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      background-color: #f39c12;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
    }

    /* Edit Area */
    #srt-edit-area {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: monospace;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎧 Everyday English</h1>

    <div id="now-playing">Now Playing: <span id="now-playing-title"></span></div>
    <audio id="global-player" controls>Your browser does not support audio.</audio>

    <div id="transcript-area">
      <h3>Transcript for <span id="transcript-episode-title"></span></h3>

      <!-- We keep this minimal — no message, just edit button if needed -->
      <div id="locked-view" style="display: none;">
        <!-- Not used anymore — we go straight to unlocked-view when transcript loads -->
      </div>

      <div id="unlocked-view" style="display: none;">
        <div id="upload-section" style="display: none;">
          <label for="srt-upload">Upload .srt file:</label>
          <input type="file" id="srt-upload" accept=".srt" />
          <p id="upload-status"></p>
        </div>

        <!-- Edit button inside subtitle window -->
        <div style="margin-top: 8px; text-align: right;">
          <button id="edit-srt-btn" class="btn-edit" onclick="toggleSrtEditMode()" style="display: none;">edit</button>
        </div>

        <div id="sync-transcript">
          <!-- Subtitle lines appear here -->
        </div>

        <!-- Editable textarea (hidden by default) -->
        <textarea id="srt-edit-area" 
                  style="display: none; width: 100%; height: 250px; margin-top: 10px;"
                  placeholder="Paste or edit your .srt content here..."></textarea>
        <div id="edit-actions" style="display: none; margin-top: 8px;">
          <button class="btn-edit" onclick="saveEditedSrt()">Save Changes</button>
          <button style="margin-left: 8px; background: #95a5a6;" onclick="cancelSrtEdit()">Cancel</button>
        </div>
      </div>
    </div>

    <div id="podcasts-container">
      <div class="loading">Loading podcast programs...</div>
    </div>
  </div>

  <script>
    // === CONFIGURATION (PERSONAL USE ONLY) ===
    const APP_ID = 'wUyKly0pmyWB9KTdnd5Haal5-gzGzoHsz';
    const APP_KEY = 'y17v810tf534T8dISL1ozVgF';
    const MASTER_KEY = 'U17JUEyx4GAK7ERghxyrpBBw'; // 🔑 MASTER KEY — DO NOT SHARE!
    const TRANSCRIPT_PASS = 'wang123';

    AV.init({
      appId: APP_ID,
      appKey: APP_KEY,
      masterKey: MASTER_KEY,
      serverURLs: 'https://api.leancloud.cn'
    });

    const TranscriptClass = AV.Object.extend('Transcript');

    // === STATE ===
    let currentEpisodeUrl = null;
    let currentEpisodeTitle = null;
    let currentEpisodeButton = null;
    let syncInterval = null;
    let currentCues = [];

    // === DOM ELEMENTS ===
    const player = document.getElementById('global-player');
    const nowPlayingTitleEl = document.getElementById('now-playing-title');
    const nowPlayingEl = document.getElementById('now-playing');
    const transcriptArea = document.getElementById('transcript-area');
    const transcriptTitleEl = document.getElementById('transcript-episode-title');

    // === HELPER FUNCTIONS ===
    function escapeHTML(str) {
      if (typeof str !== 'string') return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    async function fetchEpisodesViaRSS2JSON(feedUrl) {
      const proxyUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}`;
      const res = await fetch(proxyUrl);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (data.status !== 'ok') throw new Error(data.message || 'Invalid RSS response');
      return data.items || [];
    }

    async function checkTranscriptsExistence(episodeUrls) {
      if (episodeUrls.length === 0) return new Set();
      const query = new AV.Query('Transcript');
      query.containedIn('episodeUrl', episodeUrls);
      query.exists('srtContent');
      query.select(['episodeUrl']);
      const results = await query.find();
      return new Set(results.map(r => r.get('episodeUrl')));
    }

    function parseSRT(srtText) {
      const blocks = srtText.trim().split(/\n\s*\n/);
      const cues = [];
      for (const block of blocks) {
        const lines = block.split('\n').filter(line => line.trim() !== '');
        if (lines.length < 3) continue;
        const timeLine = lines[1];
        const text = lines.slice(2).join(' ');
        const match = timeLine.match(/(\d{2}:\d{2}:\d{2},\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2},\d{3})/);
        if (!match) continue;
        const start = timeToSeconds(match[1]);
        const end = timeToSeconds(match[2]);
        cues.push({ start, end, text });
      }
      return cues.sort((a, b) => a.start - b.start);
    }

    function timeToSeconds(timeStr) {
      const [hours, minutes, secondsMs] = timeStr.replace(',', '.').split(':');
      const [seconds, ms] = secondsMs.split('.');
      return parseInt(hours) * 3600 + parseInt(minutes) * 60 + parseInt(seconds) + parseFloat('0.' + ms);
    }

    function secondsToSrtTime(seconds) {
      const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
      const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
      const s = Math.floor(seconds % 60).toString().padStart(2, '0');
      const ms = Math.floor((seconds % 1) * 1000).toString().padStart(3, '0');
      return `${h}:${m}:${s},${ms}`;
    }

    function startSyncTranscript(cues) {
      currentCues = cues;
      clearInterval(syncInterval);
      syncInterval = setInterval(updateTranscriptDisplay, 100);
    }

    function updateTranscriptDisplay() {
      if (!player || currentCues.length === 0) return;

      const currentTime = player.currentTime;
      let currentIndex = -1;

      for (let i = 0; i < currentCues.length; i++) {
        if (currentTime >= currentCues[i].start) {
          currentIndex = i;
        } else {
          break;
        }
      }

      const syncDiv = document.getElementById('sync-transcript');
      let linesHTML = [];

      if (currentIndex === -1) {
        const futureCount = Math.min(3, currentCues.length);
        for (let i = 0; i < futureCount; i++) {
          linesHTML.push(`<div>${escapeHTML(currentCues[i].text)}</div>`);
        }
      } else {
        const startIdx = Math.max(0, currentIndex - 10);
        for (let i = startIdx; i <= currentIndex; i++) {
          linesHTML.push(`<div style="font-weight: ${i === currentIndex ? 'bold' : 'normal'};">${escapeHTML(currentCues[i].text)}</div>`);
        }

        const futureEnd = Math.min(currentIndex + 3, currentCues.length - 1);
        for (let i = currentIndex + 1; i <= futureEnd; i++) {
          linesHTML.push(`<div>${escapeHTML(currentCues[i].text)}</div>`);
        }
      }

      syncDiv.innerHTML = linesHTML.join('');
    }

    // === EDIT MODE WITH PASSWORD ===
    async function toggleSrtEditMode() {
      const syncDiv = document.getElementById('sync-transcript');
      const editArea = document.getElementById('srt-edit-area');
      const editActions = document.getElementById('edit-actions');
      const editBtn = document.getElementById('edit-srt-btn');

      if (syncDiv.style.display !== 'none') {
        // Entering edit mode — require password
        const password = prompt("Enter password to edit subtitles:");
        if (password !== TRANSCRIPT_PASS) {
          alert("Incorrect password.");
          return;
        }

        try {
          // Fetch latest SRT from LeanCloud
          const query = new AV.Query('Transcript');
          query.equalTo('episodeUrl', currentEpisodeUrl);
          const results = await query.find();
          let srtText = '';

          if (results.length > 0) {
            srtText = results[0].get('srtContent') || '';
          } else {
            // Fallback: reconstruct from currentCues
            srtText = currentCues.map((cue, i) => {
              const start = secondsToSrtTime(cue.start);
              const end = secondsToSrtTime(cue.end);
              return `${i + 1}\n${start} --> ${end}\n${cue.text}\n`;
            }).join('\n');
          }

          editArea.value = srtText;
          syncDiv.style.display = 'none';
          editArea.style.display = 'block';
          editActions.style.display = 'block';
          editBtn.textContent = 'view';
        } catch (err) {
          console.error('Failed to load SRT for editing:', err);
          alert('Could not load transcript for editing.');
        }
      } else {
        // Exiting edit mode — no password needed
        syncDiv.style.display = 'block';
        editArea.style.display = 'none';
        editActions.style.display = 'none';
        editBtn.textContent = 'edit';
      }
    }

    async function saveEditedSrt() {
      const newText = document.getElementById('srt-edit-area').value.trim();
      if (!newText) {
        alert("SRT content cannot be empty.");
        return;
      }

      try {
        const newCues = parseSRT(newText);
        if (newCues.length === 0) throw new Error("No valid subtitles found.");

        const query = new AV.Query('Transcript');
        query.equalTo('episodeUrl', currentEpisodeUrl);
        let transcriptObj = await query.first();

        if (!transcriptObj) {
          transcriptObj = new TranscriptClass();
          transcriptObj.set('episodeUrl', currentEpisodeUrl);
        }
        transcriptObj.set('srtContent', newText);

        await transcriptObj.save(null, { useMasterKey: true });

        document.getElementById('upload-status').textContent = 'Changes saved successfully.';
        document.getElementById('upload-status').style.color = '#27ae60';

        currentCues = newCues;
        updateTranscriptDisplay();
        toggleSrtEditMode(); // back to view

        if (currentEpisodeButton) {
          currentEpisodeButton.classList.add('has-transcript');
        }

      } catch (err) {
        console.error('Save error:', err);
        alert('Failed to save: ' + (err.message || 'Unknown error'));
      }
    }

    function cancelSrtEdit() {
      toggleSrtEditMode();
    }

    // === PODCAST RENDERING ===
    function renderPodcast(program) {
      const container = document.getElementById('podcasts-container');
      const card = document.createElement('div');
      card.className = 'podcast-card';
      card.innerHTML = `
        <div class="podcast-header" data-id="${program.id}">
          ${escapeHTML(program.get('name'))}
          <span>▶</span>
        </div>
        <div class="episodes-list" id="episodes-${program.id}">
          <div class="loading">Loading episodes...</div>
        </div>
      `;
      container.appendChild(card);

      const header = card.querySelector('.podcast-header');
      const episodesList = card.querySelector('.episodes-list');

      header.addEventListener('click', async () => {
        const isActive = episodesList.classList.contains('active');
        if (isActive) {
          episodesList.classList.remove('active');
          header.querySelector('span').textContent = '▶';
          transcriptArea.style.display = 'none';
        } else {
          episodesList.classList.add('active');
          header.querySelector('span').textContent = '▼';

          if (episodesList.children.length === 1 && episodesList.querySelector('.loading')) {
            try {
              const items = await fetchEpisodesViaRSS2JSON(program.get('feedURL'));
              episodesList.innerHTML = '';

              if (items.length === 0) {
                episodesList.innerHTML = '<div class="error">No playable episodes found.</div>';
                return;
              }

              const urls = items.map(i => i.enclosure?.link).filter(l => l);
              const availableTranscripts = await checkTranscriptsExistence(urls);

              items.forEach(item => {
                if (!item.enclosure?.link) return;

                const url = item.enclosure.link;
                const hasTranscript = availableTranscripts.has(url);
                const pubDate = new Date(item.pubDate).toLocaleDateString();

                const li = document.createElement('li');
                li.className = 'episode-item';
                li.dataset.url = url;
                li.dataset.title = item.title;

                const textButton = document.createElement('button');
                textButton.className = `btn-text ${hasTranscript ? 'has-transcript' : ''}`;
                textButton.textContent = 'Text';
                textButton.onclick = (e) => {
                  e.stopPropagation();
                  toggleTranscript(url, item.title, textButton, hasTranscript);
                };

                li.innerHTML = `
                  <div class="episode-info">
                    <div class="episode-title">${escapeHTML(item.title)}</div>
                    <div class="episode-date">Published: ${pubDate}</div>
                  </div>
                `;
                li.appendChild(textButton);
                li.addEventListener('click', () => playEpisode(url, item.title, li));
                episodesList.appendChild(li);
              });
            } catch (err) {
              console.error('Episode load error:', err);
              episodesList.innerHTML = `<div class="error">Failed to load episodes: ${escapeHTML(err.message)}</div>`;
            }
          }
        }
      });
    }

    function playEpisode(url, title, listItem) {
      player.src = url;
      player.load();
      player.play();
      nowPlayingTitleEl.textContent = title;
      nowPlayingEl.style.display = 'block';
      player.style.display = 'block';
      document.querySelectorAll('.episode-item').forEach(el => el.classList.remove('active'));
      listItem.classList.add('active');
      clearInterval(syncInterval);
      currentCues = [];
    }

    async function toggleTranscript(url, title, buttonElement, hasTranscript) {
      if (transcriptArea.style.display === 'block' && currentEpisodeUrl === url) {
        transcriptArea.style.display = 'none';
        return;
      }

      currentEpisodeUrl = url;
      currentEpisodeTitle = title;
      currentEpisodeButton = buttonElement;
      transcriptTitleEl.textContent = title;
      transcriptArea.style.display = 'block';

      document.getElementById('unlocked-view').style.display = 'block';
      document.getElementById('sync-transcript').innerHTML = '';
      document.getElementById('edit-srt-btn').style.display = hasTranscript ? 'inline-block' : 'none';

      clearInterval(syncInterval);
      currentCues = [];

      if (hasTranscript) {
        try {
          const query = new AV.Query('Transcript');
          query.equalTo('episodeUrl', url);
          const results = await query.find();
          if (results.length > 0) {
            const srtText = results[0].get('srtContent');
            const cues = parseSRT(srtText);
            if (cues.length > 0) {
              startSyncTranscript(cues);
              return;
            }
          }
        } catch (err) {
          console.error('Failed to load saved transcript:', err);
        }
      }

      // If no transcript or failed to load
      document.getElementById('sync-transcript').innerHTML = 'No subtitle available.';
    }

    // === INIT ===
    async function loadPrograms() {
      const container = document.getElementById('podcasts-container');
      try {
        const query = new AV.Query('podcast');
        query.addDescending('createdAt');
        const results = await query.find();
        container.innerHTML = '';
        if (results.length === 0) {
          container.innerHTML = '<div class="error">No podcast programs found.</div>';
          return;
        }
        results.forEach(renderPodcast);
      } catch (err) {
        console.error('LeanCloud error:', err);
        container.innerHTML = `<div class="error">Failed to load podcasts: ${err.message}</div>`;
      }
    }

    loadPrograms();
  </script>
</body>
</html>
