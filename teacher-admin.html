<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Manage Class Types</title>
  <script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.13.2/dist/av-min.js"></script>
  <style>
    body { 
      font-family: Arial; 
      max-width: 600px; 
      margin: 20px auto; 
      padding: 0 15px; 
    }
    input, button { 
      padding: 8px; 
      margin: 6px; 
    }
    table { 
      width: 100%; 
      border-collapse: collapse; 
      margin-top: 20px; 
    }
    th, td { 
      border: 1px solid #ccc; 
      padding: 10px; 
      text-align: left; 
    }
    .error { color: red; }
    .success { color: green; }
    .form-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .form-row input {
      flex: 1;
    }
  </style>
</head>
<body>
  <h2>Manage Class Types (Stored in LeanCloud)</h2>

  <div id="status"></div>

  <form id="addClassForm">
    <div class="form-row">
      <input type="text" id="className" placeholder="Class name (e.g., H189_Main)" required />
      <input type="number" id="classHours" placeholder="Hours/session" step="0.25" min="0.25" required />
      <button type="submit">Add Class Type</button>
    </div>
  </form>

  <table id="classTable">
    <thead><tr><th>Class Type</th><th>Hours/Session</th><th>Action</th></tr></thead>
    <tbody></tbody>
  </table>

  <script>
    // Initialize LeanCloud
    AV.init({
      appId: "qqGQwbksBnwD2Dbdajp1jLZY-gzGzoHsz",
      appKey: "SMx2RHGXoV82nuXnreLNzLhm",
      serverURL: "https://qqgqwbks.lc-cn-n1-shared.com"
    });

    const ClassType = AV.Object.extend('ClassType');
    let editingRowId = null;

    function showMessage(text, isError = false) {
      const el = document.getElementById('status');
      el.textContent = text;
      el.className = isError ? 'error' : 'success';
      setTimeout(() => el.textContent = '', 3000);
    }

    async function loadClassTypes() {
      const query = new AV.Query(ClassType);
      query.addAscending('name');
      try {
        const results = await query.find();
        renderClassTable(results);
      } catch (err) {
        console.error("Load error:", err);
        showMessage("Failed to load class types.", true);
      }
    }

    function renderClassTable(objects) {
      const tbody = document.querySelector('#classTable tbody');
      tbody.innerHTML = '';
      objects.forEach(obj => {
        const tr = document.createElement('tr');
        tr.dataset.id = obj.id;
        tr.innerHTML = `
          <td>${escapeHtml(obj.get('name'))}</td>
          <td>${obj.get('hoursPerSession')}</td>
          <td>
            <button onclick="startEdit('${obj.id}', '${escapeHtml(obj.get('name'))}', ${obj.get('hoursPerSession')})">Edit</button>
            <button onclick="deleteClass('${obj.id}')">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Start inline edit
    function startEdit(objectId, name, hours) {
      if (editingRowId) return; // Prevent multiple edits
      editingRowId = objectId;

      const row = document.querySelector(`tr[data-id="${objectId}"]`);
      row.innerHTML = `
        <td>
          <input type="text" value="${escapeHtml(name)}" class="edit-name" required />
        </td>
        <td>
          <input type="number" value="${hours}" step="0.25" min="0.25" class="edit-hours" required />
        </td>
        <td>
          <button onclick="saveEdit('${objectId}')">Save</button>
          <button onclick="cancelEdit('${objectId}')">Cancel</button>
        </td>
      `;
    }

    async function saveEdit(objectId) {
      const row = document.querySelector(`tr[data-id="${objectId}"]`);
      const nameInput = row.querySelector('.edit-name');
      const hoursInput = row.querySelector('.edit-hours');

      const name = nameInput.value.trim();
      const hours = parseFloat(hoursInput.value);

      if (!name || isNaN(hours) || hours <= 0) {
        showMessage("Invalid input.", true);
        return;
      }

      // Optional: check for duplicate names (excluding self)
      const query = new AV.Query(ClassType);
      query.equalTo('name', name);
      const existing = await query.find();
      const isDuplicate = existing.some(obj => obj.id !== objectId);
      if (isDuplicate) {
        showMessage("Another class type already uses this name!", true);
        return;
      }

      try {
        const obj = AV.Object.createWithoutData('ClassType', objectId);
        obj.set('name', name);
        obj.set('hoursPerSession', hours);
        await obj.save();
        showMessage("Updated successfully.");
        editingRowId = null;
        loadClassTypes(); // Refresh list
      } catch (err) {
        console.error("Update error:", err);
        showMessage("Failed to update.", true);
      }
    }

    function cancelEdit(objectId) {
      editingRowId = null;
      loadClassTypes(); // Re-render original view
    }

    async function deleteClass(objectId) {
      if (!confirm("Delete this class type? This cannot be undone.")) return;
      try {
        const obj = AV.Object.createWithoutData('ClassType', objectId);
        await obj.destroy();
        showMessage("Deleted.");
        loadClassTypes();
      } catch (err) {
        console.error("Delete error:", err);
        showMessage("Failed to delete.", true);
      }
    }

    document.getElementById('addClassForm').addEventListener('submit', async e => {
      e.preventDefault();
      const name = document.getElementById('className').value.trim();
      const hours = parseFloat(document.getElementById('classHours').value);

      if (!name || isNaN(hours) || hours <= 0) {
        showMessage("Invalid input.", true);
        return;
      }

      const query = new AV.Query(ClassType);
      query.equalTo('name', name);
      const existing = await query.find();
      if (existing.length > 0) {
        showMessage("Class type already exists!", true);
        return;
      }

      try {
        const obj = new ClassType();
        obj.set('name', name);
        obj.set('hoursPerSession', hours);
        await obj.save();
        showMessage("Class type added.");
        loadClassTypes();
        document.getElementById('addClassForm').reset();
      } catch (err) {
        console.error("Save error:", err);
        showMessage("Failed to save.", true);
      }
    });

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    loadClassTypes();
  </script>
</body>
</html>
