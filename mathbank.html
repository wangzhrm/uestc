<!DOCTYPE html>
<html>
<head>
    <title>AST Secure Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.12.0/dist/av-min.js"></script>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root { --primary: #1890ff; --success: #52c41a; --danger: #ff4d4f; --sidebar-w: 320px; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; height: 100vh; background: #f0f2f5; overflow: hidden; }

        /* LOGIN OVERLAY */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #f0f2f5; z-index: 5000;
            display: flex; align-items: center; justify-content: center;
        }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        .login-card input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        
        #app-wrapper { display: none; width: 100%; height: 100%; flex-direction: row; }

        /* DRAWER & TOGGLE */
        #drawer {
            position: fixed; left: calc(-1 * var(--sidebar-w)); top: 0;
            width: var(--sidebar-w); height: 100%; background: white;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 1000;
            transition: left 0.3s ease; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box;
        }
        #drawer.open { left: 0; }
        #toggle-bar {
            position: fixed; left: 0; top: 0; width: 30px; height: 100%;
            background: #444; color: white; cursor: pointer; z-index: 1001;
            display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl;
            font-size: 12px; letter-spacing: 2px; transition: left 0.3s ease;
        }
        #drawer.open + #toggle-bar { left: var(--sidebar-w); }

        .main-container { flex: 1; display: flex; margin-left: 30px; width: calc(100% - 30px); }
        .editor-area { flex: 1; padding: 20px; overflow-y: auto; }
        .right-sidebar { width: 420px; background: #fff; border-left: 1px solid #ddd; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }

        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        textarea { width: 100%; height: 150px; margin: 10px 0; border: 1px solid #d9d9d9; padding: 10px; border-radius: 4px; font-family: monospace; box-sizing: border-box; }
        
        .preview { padding: 15px; border: 1px dashed #ccc; margin-bottom: 20px; min-height: 50px; line-height: 1.6; border-radius: 4px; white-space: pre-wrap; }
        #qP { background: #f6ffed; border-color: #b7eb8f; }
        #sP { background: #e6f7ff; border-color: #91d5ff; }
        
        .hierarchy-box { margin-bottom: 15px; }
        .hierarchy-title { font-weight: bold; color: var(--primary); margin-bottom: 5px; display: block; font-size: 13px; }
        .scroll-list { width: 100%; height: 120px; border: 1px solid #d9d9d9; border-radius: 4px; overflow-y: auto; }
        
        .q-list-item { padding: 12px; border: 1px solid #eee; margin-bottom: 10px; border-radius: 6px; font-size: 12px; }
        .tag { background: #e6f7ff; color: #1890ff; padding: 2px 6px; border-radius: 4px; margin-right: 4px; font-size: 10px; border: 1px solid #91d5ff; }

        .filter-section { background: #fafafa; padding: 12px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #eee; }
        .filter-select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 10px; }
        
        button { cursor: pointer; border-radius: 4px; border: none; font-weight: bold; }
        .primary-btn { background: var(--primary); color: white; padding: 12px; width: 100%; }
        .save-btn { background: var(--success); position: sticky; bottom: 0; z-index: 10; margin-top: 10px; }
        .edit-btn { background: #faad14; color: white; padding: 6px 10px; margin-right: 5px; }
        .del-btn { background: var(--danger); color: white; padding: 6px 10px; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <h2>AST Master Login</h2>
            <input type="text" id="userInput" placeholder="Username">
            <input type="password" id="passInput" placeholder="Password">
            <button onclick="attemptLogin()" class="primary-btn" id="loginBtn">Unlock System</button>
            <p id="loginMsg" style="color: var(--danger); font-size: 14px;"></p>
        </div>
    </div>

    <div id="app-wrapper">
        <div id="drawer">
            <h3>Hierarchy Manager</h3>
            <input type="text" id="newCatName" placeholder="New Category...">
            <select id="targetParent" style="width:100%; margin: 10px 0; padding:8px;"><option value="">New Root</option></select>
            <button onclick="addCategory()" class="primary-btn" style="padding:8px;">Add Category</button>
            <div id="categoryTree" style="overflow-y: auto; flex: 1; margin-top:10px;"></div>
        </div>

        <div id="toggle-bar" onclick="toggleDrawer()">☰ HIERARCHIES</div>

        <div class="main-container">
            <div class="editor-area">
                <div class="card">
                    <h2 id="editor-title" style="margin-top:0;">Question Editor</h2>
                    <input type="hidden" id="editingId" value="">
                    <strong>Question LaTeX</strong>
                    <textarea id="qInput" oninput="refreshPreview('qP', this.value)"></textarea>
                    <div id="qP" class="preview">Question Preview</div>
                    <strong>Solution LaTeX</strong>
                    <textarea id="sInput" oninput="refreshPreview('sP', this.value)"></textarea>
                    <div id="sP" class="preview">Solution Preview</div>
                </div>
            </div>

            <div class="right-sidebar">
                <h3>Categorization</h3>
                <div id="editorHierarchies"></div>
                <button class="primary-btn save-btn" onclick="submitQuestion()">SAVE QUESTION</button>
                <button id="cancelEdit" style="display:none; margin-top:5px; width:100%; padding:8px;" onclick="resetEditor(true)">Cancel Edit (Clear All)</button>

                <h3 style="margin-top:20px;">Question Manager</h3>
                <div class="filter-section">
                    <input type="text" id="qSearch" placeholder="Search text..." oninput="fetchQuestions()" class="filter-select">
                    <div id="dynamicFilters"></div>
                    <button onclick="clearFilters()" style="width:100%; font-size:11px; color:#1890ff; background:none;">Clear All Filters</button>
                </div>
                <div id="existingQuestionsList"></div>
            </div>
        </div>
    </div>

<script>
    AV.init({ appId: "XjQ3V5jxCqhiZfjZf0JFLNiN-gzGzoHsz", appKey: "LJwsKB85okDVlJODxvQTBdrX", serverURL: "https://xjq3v5jx.lc-cn-n1-shared.com" });

    const Category = AV.Object.extend('Category');
    const MathQuestion = AV.Object.extend('MathQuestion');
    let categoryMap = {};

    async function attemptLogin() {
        const u = document.getElementById('userInput').value;
        const p = document.getElementById('passInput').value;
        try {
            const query = new AV.Query('Master');
            query.equalTo('username', u); query.equalTo('password', p);
            const result = await query.first();
            if (result) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('app-wrapper').style.display = 'flex';
                await renderApp();
                fetchQuestions();
            } else { alert("Invalid credentials"); }
        } catch (e) { alert(e.message); }
    }

    function toggleDrawer() { document.getElementById('drawer').classList.toggle('open'); }

    /**
     * Updates preview with line-break support.
     */
    function refreshPreview(id, val) {
        const el = document.getElementById(id);
        // nl2br logic: preserves user layout in preview
        const formatted = (val || "Preview").replace(/\n/g, '<br>');
        el.innerHTML = formatted; 
        MathJax.typesetPromise([el]);
    }

    async function fetchQuestions() {
        const searchText = document.getElementById('qSearch').value;
        const filterSelects = document.querySelectorAll('.dynamic-cat-filter');
        const container = document.getElementById('existingQuestionsList');
        
        const query = new AV.Query('MathQuestion');
        query.limit(40);
        query.descending('createdAt');
        query.include('categories');

        if(searchText) query.contains('latexQuestion', searchText);
        
        const selectedIds = Array.from(filterSelects).map(s => s.value).filter(v => v !== "");
        
        if (selectedIds.length > 0) {
            const catPointers = selectedIds.map(id => AV.Object.createWithoutData('Category', id));
            query.containsAll('categories', catPointers);
        }
        
        const results = await query.find();
        container.innerHTML = results.length ? "" : "<p style='text-align:center;color:#999'>No results.</p>";
        
        results.forEach(q => {
            const qCats = q.get('categories') || [];
            const tags = qCats.map(c => `<span class="tag">${categoryMap[c.id] || '...'}</span>`).join('');
            const div = document.createElement('div');
            div.className = 'q-list-item';
            div.innerHTML = `
                <div style="margin-bottom:5px;">${tags}</div>
                <div style="color:#666">${q.get('latexQuestion').substring(0,60)}...</div>
                <div style="margin-top:8px;">
                    <button class="edit-btn" onclick="editQuestion('${q.id}')">Edit</button>
                    <button class="del-btn" onclick="deleteQuestion('${q.id}')">Delete</button>
                </div>`;
            container.appendChild(div);
        });
    }

    async function editQuestion(id) {
        const q = await new AV.Query('MathQuestion').get(id);
        document.getElementById('editingId').value = id;
        document.getElementById('qInput').value = q.get('latexQuestion');
        document.getElementById('sInput').value = q.get('latexSolution');
        document.getElementById('cancelEdit').style.display = "block";
        
        const selectedIds = q.get('categories').map(c => c.id);
        document.querySelectorAll('.question-cat-select').forEach(sel => {
            Array.from(sel.options).forEach(opt => opt.selected = selectedIds.includes(opt.value));
        });
        refreshPreview('qP', q.get('latexQuestion'));
        refreshPreview('sP', q.get('latexSolution'));
    }

    async function submitQuestion() {
        const qId = document.getElementById('editingId').value;
        const selects = document.querySelectorAll('.question-cat-select');
        let catIds = [];
        selects.forEach(s => catIds = catIds.concat(Array.from(s.selectedOptions).map(o => o.value)));
        
        if (catIds.length === 0) return alert("Select at least one category");
        
        const mq = qId ? AV.Object.createWithoutData('MathQuestion', qId) : new MathQuestion();
        mq.set('latexQuestion', document.getElementById('qInput').value);
        mq.set('latexSolution', document.getElementById('sInput').value);
        mq.set('categories', catIds.map(id => AV.Object.createWithoutData('Category', id)));
        
        await mq.save();
        alert("Saved!");
        resetEditor(false); // Keeps Year/Part, clears Chapter
        fetchQuestions();
    }

    /**
     * Logic to preserve Year/Part selections while resetting Chapters.
     */
    function resetEditor(forceClearAll = false) {
        document.getElementById('editingId').value = "";
        document.getElementById('qInput').value = "";
        document.getElementById('sInput').value = "";
        document.getElementById('cancelEdit').style.display = "none";
        refreshPreview('qP', "");
        refreshPreview('sP', "");

        const selects = document.querySelectorAll('.question-cat-select');
        selects.forEach(sel => {
            const type = sel.getAttribute('data-type').toLowerCase();
            // If it's a chapter root, reset it. Otherwise, keep it for the next entry.
            if (forceClearAll || type.includes("chapter")) {
                sel.selectedIndex = -1;
                Array.from(sel.options).forEach(opt => opt.selected = false);
            }
        });
    }

    function clearFilters() {
        document.getElementById('qSearch').value = "";
        document.querySelectorAll('.dynamic-cat-filter').forEach(s => s.value = "");
        fetchQuestions();
    }

    async function renderApp() {
        const query = new AV.Query('Category'); query.ascending('order');
        const cats = await query.limit(1000).find();
        const treeDiv = document.getElementById('categoryTree');
        const editorHierarchies = document.getElementById('editorHierarchies');
        const dynamicFilters = document.getElementById('dynamicFilters');
        const parentDropdown = document.getElementById('targetParent');
        
        treeDiv.innerHTML = ""; editorHierarchies.innerHTML = ""; dynamicFilters.innerHTML = "";
        cats.forEach(c => categoryMap[c.id] = c.get('name'));

        const roots = cats.filter(c => !c.get('parent'));
        roots.forEach(root => {
            const rootName = root.get('name');
            const children = cats.filter(c => c.get('parent')?.id === root.id);
            
            const label = document.createElement('div');
            label.className = 'hierarchy-title';
            label.innerText = rootName;
            const fSel = document.createElement('select');
            fSel.className = 'filter-select dynamic-cat-filter';
            fSel.onchange = fetchQuestions;
            fSel.innerHTML = `<option value="">All ${rootName}</option>`;
            
            const eBox = document.createElement('div'); eBox.className = 'hierarchy-box';
            eBox.innerHTML = `<span class="hierarchy-title">${rootName}</span>`;
            const eSel = document.createElement('select');
            eSel.className = 'scroll-list question-cat-select'; 
            eSel.multiple = true;
            eSel.setAttribute('data-type', rootName); // Used for sticky logic

            children.forEach(child => {
                fSel.innerHTML += `<option value="${child.id}">${child.get('name')}</option>`;
                eSel.innerHTML += `<option value="${child.id}">${child.get('name')}</option>`;
            });

            dynamicFilters.appendChild(label);
            dynamicFilters.appendChild(fSel);
            eBox.appendChild(eSel);
            editorHierarchies.appendChild(eBox);
            parentDropdown.innerHTML += `<option value="${root.id}">${rootName}</option>`;
        });
    }

    async function deleteQuestion(id) { if(confirm("Delete?")) { await AV.Object.createWithoutData('MathQuestion', id).destroy(); fetchQuestions(); } }
    async function addCategory() {
        const n = document.getElementById('newCatName').value;
        const p = document.getElementById('targetParent').value;
        if(!n) return;
        const c = new Category(); c.set('name', n); c.set('order', Date.now());
        if(p) c.set('parent', AV.Object.createWithoutData('Category', p));
        await c.save(); location.reload();
    }
</script>
</body>
</html>
