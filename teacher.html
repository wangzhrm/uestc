<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Teaching Calendar & OT Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body { 
    font-family: 'Segoe UI', -apple-system, sans-serif; 
    background: #f4f7f6; 
    padding: 20px; 
    max-width: 1000px; 
    margin: auto; 
    color: #333; 
    transition: background-color 0.4s ease;
  }
  .header-container { text-align: center; margin-bottom: 20px; }
  .ot-balance { font-size: 1.1rem; color: #2a9d8f; font-weight: bold; background: white; display: inline-block; padding: 8px 20px; border-radius: 50px; border: 2px solid #2a9d8f; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
  .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .day-header { text-align: center; font-weight: bold; background: #34495e; color: white; padding: 10px 2px; border-radius: 4px; font-size: 0.8rem; }
  .date-cell { background: white; border: 1px solid #ddd; min-height: 100px; padding: 4px; cursor: pointer; border-radius: 4px; display: flex; flex-direction: column; overflow: hidden; transition: 0.2s; }
  .date-cell:hover { border-color: #2a9d8f; background: #f0fdfa; }
  .date-number { font-weight: bold; font-size: 0.9em; color: #7f8c8d; margin-bottom: 4px; }
  
  .tag { display: block; padding: 2px 4px; border-radius: 3px; margin-bottom: 2px; color: white; font-size: 0.75em; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
  .tag-0 { background-color: #3498db; }
  .tag-1 { background-color: #9b59b6; }
  .tag-2 { background-color: #f1c40f; color: #333; }
  .tag-3 { background-color: #e67e22; }
  .tag-4 { background-color: #1abc9c; }
  .tag-default { background-color: #95a5a6; }

  .ot-indicator { font-size: 0.7em; margin-top: auto; border-top: 1px solid #eee; padding-top: 2px; display: flex; justify-content: space-between; }
  .text-ot { color: #2a9d8f; font-weight: bold; margin-right: 4px; }
  .text-to { color: #e63946; font-weight: bold; }
  .spent-ot { text-decoration: line-through; opacity: 0.4; }

  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; padding: 15px; }
  .modal-content { background: white; margin: auto; padding: 20px; max-width: 450px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
  .btn-switch { background: #34495e; color: white; padding: 15px; border-radius: 8px; border: none; cursor: pointer; width: 100%; margin-top: 20px; font-weight: bold; font-size: 1rem; }
  
  .ledger-info { background: #e0f2f1; padding: 12px; border-radius: 8px; margin-top: 15px; font-size: 0.8rem; color: #004d40; border: 1px solid #b2dfdb; line-height: 1.4; }
  .summary-box { background: white; padding: 15px; border-radius: 12px; margin-top: 25px; border: 1px solid #ddd; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px; border: 1px solid #eee; text-align: center; }
</style>
</head>
<body>

<div class="header-container">
  <h1 id="schoolTitle">School A (International)</h1>
  <div class="ot-balance">Available Balance: <span id="balanceDisplay">0.00</span> h</div>
</div>

<div class="nav">
  <button onclick="changeMonth(-1)">&#10094; Prev</button>
  <div id="currentMonth" style="font-weight: bold; font-size: 1.2rem;"></div>
  <button onclick="changeMonth(1)">Next &#10095;</button>
</div>

<div class="calendar" id="calendarGrid"></div>

<div class="summary-box">
  <h3 style="margin-top:0">Monthly Summary</h3>
  <div id="monthlySummaryContainer"></div>
</div>

<button class="btn-switch" onclick="toggleSchool()">SWITCH TO OTHER SCHOOL</button>

<div class="modal" id="editModal">
  <div class="modal-content">
    <h3 id="modalDate" style="margin-top:0; color:#2c3e50;"></h3>
    <div id="modalTable" style="max-height: 250px; overflow-y: auto; margin-bottom: 15px;"></div>
    
    <div style="display:flex; gap:10px; background:#f9f9f9; padding:12px; border-radius:8px;">
      <div style="flex:1"><label style="font-size:0.7rem; font-weight:bold; color:#666;">OT (h)</label><input type="number" id="inputOvertime" step="0.5" style="width:100%; padding:8px; border:1px solid #ddd;"></div>
      <div style="flex:1"><label style="font-size:0.7rem; font-weight:bold; color:#666;">TO (h)</label><input type="number" id="inputTimeoff" step="0.5" style="width:100%; padding:8px; border:1px solid #ddd;"></div>
    </div>

    <!-- Ledger Section -->
    <div id="ledgerInfo" class="ledger-info" style="display:none;"></div>

    <div style="margin-top:20px; display:flex; gap:10px;">
      <button onclick="saveDayData()" id="saveBtn" style="flex:1; background:#2a9d8f; color:white; border:none; padding:12px; border-radius:6px; font-weight:bold;">Save Record</button>
      <button onclick="closeModal()" style="flex:1; background:#eee; padding:12px; border-radius:6px;">Cancel</button>
    </div>
  </div>
</div>

<script>
(function () {
// ============================================
// Supabase setup (replaces AV.init)
// ============================================
const SUPABASE_URL = "https://btwdbphheotbqrmbswgk.supabase.co";
const SUPABASE_KEY = "sb_publishable_9lY3A1HrgERNIC597NEAKQ_YTCmkh2k";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const RECORDS_TABLE = "teacher_records";
const CLASS_TYPES_TABLE = "teacher_class_types";

let currentSchool = "School_A";
let year = new Date().getFullYear();
let month = new Date().getMonth();
let classTypes = [];
let selectedDate = "";

let globalOtStatus = {}; 
let globalTimeoffSources = {};

function toggleSchool() {
  currentSchool = (currentSchool === "School_A") ? "School_B" : "School_A";
  document.body.style.backgroundColor = (currentSchool === "School_B") ? "#e8f5e9" : "#f4f7f6";
  document.getElementById("schoolTitle").textContent = currentSchool === "School_A" ? "School A (International)" : "School B (Second School)";
  initApp();
}

async function initApp() {
  const { data, error } = await sb
    .from(CLASS_TYPES_TABLE)
    .select("*")
    .eq("school", currentSchool)
    .order("id", { ascending: true });

  if (error) {
    console.error("Error loading class types:", error);
    classTypes = [];
  } else {
    classTypes = (data || []).map(parseType);
  }
  renderCalendar();
}

function parseType(o) {
  return { name: o.name, key: o.name.replace(/\W/g,"_"), hours: Number(o.hours_per_session) };
}

function renderCalendar() {
  const grid = document.getElementById("calendarGrid");
  grid.innerHTML = "";
  document.getElementById("currentMonth").textContent = `${year}-${String(month+1).padStart(2,"0")}`;
  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(d => {
    const h = document.createElement("div"); h.className="day-header"; h.textContent=d; grid.appendChild(h);
  });
  const firstDay = new Date(year, month, 1).getDay();
  const totalDays = new Date(year, month + 1, 0).getDate();
  for(let i=0; i<firstDay; i++) grid.appendChild(document.createElement("div")).className="date-cell";
  for(let d=1; d<=totalDays; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const cell = document.createElement("div"); cell.className="date-cell";
    cell.innerHTML = `<div class="date-number">${d}</div><div id="sum-${dateStr}"></div><div id="ot-${dateStr}" class="ot-indicator"></div>`;
    cell.onclick = () => openModal(dateStr);
    grid.appendChild(cell);
  }
  refreshData();
}

function parseDateStr(str) {
  const [y, m, d] = str.split("-").map(Number);
  return new Date(y, m - 1, d);
}

async function refreshData() {
  const { data: records, error } = await sb
    .from(RECORDS_TABLE)
    .select("*")
    .eq("school", currentSchool)
    .order("date", { ascending: true });

  if (error) {
    console.error("Error loading records:", error);
    return;
  }

  let totalBal = 0, mHrs = 0;
  const mTotals = {};
  classTypes.forEach(c => mTotals[c.key] = {q:0, h:0});

  globalOtStatus = {};
  globalTimeoffSources = {};
  let otQueue = [];

  (records || []).forEach(r => {
    if (!r.date) return;
    const d = parseDateStr(r.date);
    const dateKey = formatDate(d);
    const ot = Number(r.overtime) || 0;
    const to = Number(r.timeoff) || 0;
    
    totalBal += (ot - to);

    if (ot > 0) {
      globalOtStatus[dateKey] = { total: ot, available: ot, usedBy: [] };
      otQueue.push({ date: dateKey, available: ot });
    }

    if (to > 0) {
      globalTimeoffSources[dateKey] = [];
      let remainingTo = to;
      for (let i = 0; i < otQueue.length && remainingTo > 0; i++) {
        if (otQueue[i].available > 0) {
          let deduction = Math.min(otQueue[i].available, remainingTo);
          otQueue[i].available -= deduction;
          remainingTo -= deduction;
          
          globalTimeoffSources[dateKey].push({ fromDate: otQueue[i].date, amount: deduction });
          globalOtStatus[otQueue[i].date].available -= deduction;
          globalOtStatus[otQueue[i].date].usedBy.push({ onDate: dateKey, amount: deduction });
        }
      }
    }

    if (d.getMonth() === month && d.getFullYear() === year) {
      const cls = r.classes || {};
      const sEl = document.getElementById(`sum-${dateKey}`);
      if(sEl) {
        let hContent = "";
        classTypes.forEach((c, idx) => {
          if(cls[c.key]) {
            const colorClass = idx < 5 ? `tag-${idx}` : 'tag-default';
            hContent += `<div class="tag ${colorClass}">${c.name} x${cls[c.key]}</div>`;
            mTotals[c.key].q += cls[c.key]; mTotals[c.key].h += (cls[c.key] * c.hours);
            mHrs += (cls[c.key] * c.hours);
          }
        });
        sEl.innerHTML = hContent;
      }
      
      const otEl = document.getElementById(`ot-${dateKey}`);
      if(otEl) {
        let ih = "";
        if(ot > 0) {
          const isSpent = globalOtStatus[dateKey] && globalOtStatus[dateKey].available === 0;
          ih += `<span class="text-ot ${isSpent ? 'spent-ot' : ''}">+${ot}</span>`;
        }
        if(to > 0) ih += `<span class="text-to">-${to}</span>`;
        otEl.innerHTML = ih;
      }
    }
  });

  document.getElementById("balanceDisplay").textContent = totalBal.toFixed(2);
  renderSummaryTable(mTotals, mHrs);
}

function formatDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

async function openModal(dateStr) {
  selectedDate = dateStr;
  document.getElementById("modalDate").textContent = dateStr;
  let html = "<table><tr><th>Type</th><th>Quantity</th></tr>";
  classTypes.forEach(c => {
    html += `<tr><td>${c.name}</td><td><input type="number" id="sel_${c.key}" value="0" min="0" style="width:60px; padding:5px;"></td></tr>`;
  });
  html += "</table>";
  document.getElementById("modalTable").innerHTML = html;

  const ledgerDiv = document.getElementById("ledgerInfo");
  let ledgerHtml = "";
  if (globalOtStatus[dateStr] && globalOtStatus[dateStr].total > 0) {
    let s = globalOtStatus[dateStr];
    ledgerHtml += `<strong>OT:</strong> ${s.total}h (${s.available}h remaining)<br>`;
    s.usedBy.forEach(u => ledgerHtml += `• ${u.amount}h used on ${u.onDate}<br>`);
  }
  if (globalTimeoffSources[dateStr] && globalTimeoffSources[dateStr].length > 0) {
    ledgerHtml += `${ledgerHtml ? '<hr>' : ''}<strong>TO Source:</strong><br>`;
    globalTimeoffSources[dateStr].forEach(s => ledgerHtml += `• ${s.amount}h from ${s.fromDate}<br>`);
  }
  ledgerDiv.innerHTML = ledgerHtml;
  ledgerDiv.style.display = ledgerHtml ? "block" : "none";

  const { data: record, error } = await sb
    .from(RECORDS_TABLE)
    .select("*")
    .eq("date", dateStr)
    .eq("school", currentSchool)
    .maybeSingle();

  if (error) console.error("Error loading day record:", error);

  if(record) {
    const cls = record.classes || {};
    classTypes.forEach(c => { if(document.getElementById(`sel_${c.key}`)) document.getElementById(`sel_${c.key}`).value = cls[c.key] || 0; });
    document.getElementById("inputOvertime").value = record.overtime || 0;
    document.getElementById("inputTimeoff").value = record.timeoff || 0;
  } else {
    document.getElementById("inputOvertime").value = 0;
    document.getElementById("inputTimeoff").value = 0;
  }
  document.getElementById("editModal").style.display = "block";
}

async function saveDayData() {
  const btn = document.getElementById("saveBtn");
  btn.disabled = true; btn.textContent = "...";
  try {
    const cls = {};
    classTypes.forEach(c => { cls[c.key] = parseInt(document.getElementById(`sel_${c.key}`).value) || 0; });

    const payload = {
      date: selectedDate,
      school: currentSchool,
      classes: cls,
      overtime: Number(document.getElementById("inputOvertime").value) || 0,
      timeoff: Number(document.getElementById("inputTimeoff").value) || 0
    };

    const { error } = await sb
      .from(RECORDS_TABLE)
      .upsert(payload, { onConflict: "date,school" });

    if (error) throw error;

    closeModal(); initApp();
  } catch (e) {
    console.error(e);
    alert("Save Error");
  } finally {
    btn.disabled = false; btn.textContent = "Save Record";
  }
}

function renderSummaryTable(mTotals, totalHrs) {
  let tbl = "<table><tr><th>Type</th><th>Qty</th><th>Hrs</th></tr>";
  classTypes.forEach(c => {
    if(mTotals[c.key].q > 0) tbl += `<tr><td>${c.name}</td><td>${mTotals[c.key].q}</td><td>${mTotals[c.key].h.toFixed(1)}</td></tr>`;
  });
  tbl += `<tr style='font-weight:bold; background:#f0f7ff'><td colspan="2">Total</td><td>${totalHrs.toFixed(1)}h</td></tr></table>`;
  document.getElementById("monthlySummaryContainer").innerHTML = tbl;
}

function closeModal() { document.getElementById("editModal").style.display="none"; }
function changeMonth(d) { month += d; if(month<0){month=11;year--;} else if(month>11){month=0;year++;} renderCalendar(); }

window.toggleSchool = toggleSchool;
window.changeMonth = changeMonth;
window.saveDayData = saveDayData;
window.closeModal = closeModal;

window.onload = initApp;

})();
</script>
</body>
</html>
