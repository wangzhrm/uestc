<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Teaching Calendar & OT Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.13.2/dist/av-min.js"></script>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f7f6; padding: 20px; max-width: 1000px; margin:auto; color: #333; }
  .header-container { text-align: center; margin-bottom: 20px; }
  .ot-balance { font-size: 1.2rem; color: #2a9d8f; font-weight: bold; background: white; display: inline-block; padding: 8px 20px; border-radius: 50px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border: 2px solid #2a9d8f; }
  .nav { display:flex; justify-content:space-between; align-items: center; margin-bottom:15px; }
  
  /* Calendar Layout */
  .calendar { display:grid; grid-template-columns: repeat(7,1fr); gap:6px; }
  .day-header { text-align:center; font-weight:bold; background:#34495e; color: white; padding:10px; border-radius: 4px; }
  .date-cell { background:white; border:1px solid #ddd; min-height:110px; padding:6px; cursor:pointer; border-radius: 4px; transition: 0.2s; position: relative; overflow: hidden;}
  .date-cell:hover { border-color: #2a9d8f; background: #f0fdfa; }
  .other-month { background:#ececec; cursor: default; }
  .date-number { font-weight:bold; font-size:1em; color: #7f8c8d; margin-bottom: 5px; }
  
  /* Class Summary & Tags */
  .class-summary { font-size:0.75em; line-height:1.4; color:#2c3e50; font-weight: 500; }
  .tag { display: inline-block; padding: 2px 4px; border-radius: 3px; margin-bottom: 2px; color: white; font-size: 0.9em; width: 100%; box-sizing: border-box; }
  .tag-0 { background-color: #3498db; }
  .tag-1 { background-color: #9b59b6; }
  .tag-2 { background-color: #f1c40f; color: #333; }
  .tag-3 { background-color: #e67e22; }
  .tag-4 { background-color: #1abc9c; }
  .tag-default { background-color: #95a5a6; }

  .ot-indicator { font-size: 0.7em; margin-top: 6px; border-top: 1px solid #eee; padding-top: 4px; }
  .text-ot { color: #2a9d8f; font-weight: bold; }
  .text-to { color: #e63946; font-weight: bold; }

  /* Modal & UI */
  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index: 1000; }
  .modal-content { background:white; margin:5% auto; padding:25px; max-width:450px; border-radius:12px; }
  table { width:100%; border-collapse:collapse; margin-top:15px; }
  td, th { padding:8px; border:1px solid #eee; text-align:center; }
  select, input[type="number"] { width:100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
  .ot-inputs { background: #f9f9f9; padding: 15px; border-radius: 8px; margin-top: 15px; display: flex; gap: 15px; border: 1px solid #eee; }
  .ot-inputs div { flex: 1; }
  .ot-inputs label { font-size: 0.8em; font-weight: bold; display: block; margin-bottom: 5px; color: #666; }
  .modal-footer { text-align: right; margin-top: 20px; }
  button { padding:10px 20px; cursor:pointer; border: none; border-radius: 6px; font-weight: 600; }
  .btn-save { background: #2a9d8f; color: white; }
  .btn-cancel { background: #ecf0f1; color: #7f8c8d; margin-left: 10px; }
  .summary-box { background:white; padding:20px; border-radius:12px; margin-top:30px; border: 1px solid #ddd; }

  /* MOBILE RESPONSIVENESS */
  @media (max-width: 600px) {
    body { padding: 10px; }
    .date-cell { min-height: 75px; padding: 4px; }
    .date-number { font-size: 0.85rem; }
    .day-header { padding: 6px; font-size: 0.7rem; }
    .ot-balance { font-size: 0.9rem; padding: 6px 12px; }
    .class-summary { font-size: 0.65em; }
    .full-name { display: none; }
    .short-name { display: inline; }
    .ot-indicator { font-size: 0.6em; }
  }

  @media (min-width: 601px) {
    .full-name { display: inline; }
    .short-name { display: none; }
  }
</style>
</head>
<body>

<div class="header-container">
  <h1>Teaching Calendar</h1>
  <div class="ot-balance">Available Time-Off: <span id="balanceDisplay">0.00</span> h</div>
</div>

<div class="nav">
  <button onclick="changeMonth(-1)">&#10094; Prev</button>
  <div id="currentMonth" style="font-weight: bold; font-size: 1.4rem;"></div>
  <button onclick="changeMonth(1)">Next &#10095;</button>
</div>

<div class="calendar" id="calendarGrid"></div>

<div class="summary-box">
  <h2 style="margin-top:0">Monthly Summary</h2>
  <div id="monthlySummaryContainer"></div>
</div>

<div class="modal" id="editModal">
  <div class="modal-content">
    <h3 id="modalDate" style="margin-top:0; color:#2c3e50;"></h3>
    <table id="modalTable"></table>
    <div class="ot-inputs">
      <div>
        <label>Overtime (h)</label>
        <input type="number" id="inputOvertime" step="0.5" min="0" value="0">
      </div>
      <div>
        <label>Time-Off (h)</label>
        <input type="number" id="inputTimeoff" step="0.5" min="0" value="0">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-save" id="saveBtn" onclick="saveDayData()">Save Records</button>
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
/* LeanCloud Initialization */
AV.init({
  appId: "qqGQwbksBnwD2Dbdajp1jLZY-gzGzoHsz",
  appKey: "SMx2RHGXoV82nuXnreLNzLhm",
  serverURL: "https://qqgqwbks.lc-cn-n1-shared.com"
});

const TeachingRecord = AV.Object.extend("TeachingRecord");
const ClassType = AV.Object.extend("ClassType");

let currentViewDate = new Date();
let year = currentViewDate.getFullYear();
let month = currentViewDate.getMonth();
let classTypes = [];
let selectedDate = "";

async function initApp(){
  try {
    const res = await new AV.Query(ClassType).find();
    classTypes = res.map(o=>({
      name: o.get("name"),
      key: o.get("name").replace(/[^a-zA-Z0-9_]/g,"_"),
      hours: o.get("hoursPerSession") || 0
    }));
    renderCalendar();
  } catch (e) { console.error("Initialization error:", e); }
}

function renderCalendar(){
  const grid = document.getElementById("calendarGrid");
  grid.innerHTML = "";
  document.getElementById("currentMonth").textContent = `${year}-${String(month+1).padStart(2,"0")}`;
  
  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(d => {
    const h = document.createElement("div"); h.className="day-header"; h.textContent=d; grid.appendChild(h);
  });

  const first = new Date(year, month, 1).getDay();
  const days = new Date(year, month + 1, 0).getDate();

  for(let i=0; i<first; i++) grid.appendChild(document.createElement("div")).className="date-cell other-month";

  for(let d=1; d<=days; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const cell = document.createElement("div");
    cell.className = "date-cell";
    cell.innerHTML = `<div class="date-number">${d}</div><div class="class-summary" id="sum-${dateStr}"></div><div class="ot-indicator" id="ot-${dateStr}"></div>`;
    cell.onclick = () => openModal(dateStr);
    grid.appendChild(cell);
  }
  refreshData();
}

async function refreshData(){
  try {
    const query = new AV.Query(TeachingRecord);
    query.limit(1000); 
    const records = await query.find();

    let globalBal = 0;
    let mHrs = 0;
    const mTotals = {};
    classTypes.forEach(c => mTotals[c.key] = {q:0, h:0});

    const start = new Date(year, month, 1);
    const end = new Date(year, month + 1, 0, 23, 59, 59);

    document.querySelectorAll(".class-summary, .ot-indicator").forEach(e => e.innerHTML="");

    records.forEach(r => {
      const d = r.get("date");
      if (!d) return;

      const ot = Number(r.get("overtime")) || 0;
      const to = Number(r.get("timeoff")) || 0;
      globalBal += (ot - to);

      if (d >= start && d <= end) {
        const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
        const cls = r.get("classes") || {};
        const sEl = document.getElementById(`sum-${key}`);
        
        if(sEl){
          let h = "";
          classTypes.forEach((c, index) => {
            const qty = cls[c.key] || 0;
            if(qty > 0){
              const colorClass = index < 5 ? `tag-${index}` : 'tag-default';
              const shortName = c.name.substring(0, 2).toUpperCase();
              
              h += `<div class="tag ${colorClass}">
                      <span class="full-name">${c.name}</span>
                      <span class="short-name">${shortName}</span>
                      x${qty}
                    </div>`;
              
              mTotals[c.key].q += qty;
              mTotals[c.key].h += (qty * c.hours);
              mHrs += (qty * c.hours);
            }
          });
          sEl.innerHTML = h;
        }
        
        const otEl = document.getElementById(`ot-${key}`);
        if(otEl && (ot > 0 || to > 0)){
          let ih = "";
          if(ot > 0) ih += `<span class="text-ot">+${ot}h</span> `;
          if(to > 0) ih += `<span class="text-to">-${to}h</span>`;
          otEl.innerHTML = ih;
        }
      }
    });

    document.getElementById("balanceDisplay").textContent = globalBal.toFixed(2);
    let tbl = `<table><tr><th>Type</th><th>Qty</th><th>Hrs</th></tr>`;
    classTypes.forEach(c => tbl += `<tr><td>${c.name}</td><td>${mTotals[c.key].q}</td><td>${mTotals[c.key].h.toFixed(2)}</td></tr>`);
    tbl += `<tr style="font-weight:bold; background:#f0f7ff"><td colspan="2">Total</td><td>${mHrs.toFixed(2)}h</td></tr></table>`;
    document.getElementById("monthlySummaryContainer").innerHTML = tbl;
  } catch (err) { console.error("Refresh error:", err); }
}

async function openModal(dateStr){
  selectedDate = dateStr;
  document.getElementById("modalDate").textContent = dateStr;
  let tbl = "<tr><th>Class Type</th><th>Qty</th></tr>";
  classTypes.forEach(c => {
    let opt = ""; for(let i=0; i<=10; i++) opt += `<option value="${i}">${i}</option>`;
    tbl += `<tr><td>${c.name}</td><td><select id="sel_${c.key}">${opt}</select></td></tr>`;
  });
  document.getElementById("modalTable").innerHTML = tbl;
  
  document.getElementById("inputOvertime").value = 0;
  document.getElementById("inputTimeoff").value = 0;

  const parts = dateStr.split('-');
  const start = new Date(parts[0], parts[1]-1, parts[2], 0, 0, 0);
  const end = new Date(parts[0], parts[1]-1, parts[2], 23, 59, 59);

  try {
    const r = await new AV.Query(TeachingRecord).greaterThanOrEqualTo("date", start).lessThanOrEqualTo("date", end).first();
    if(r){
      const cls = r.get("classes") || {};
      classTypes.forEach(c => { 
        const el = document.getElementById(`sel_${c.key}`);
        if(el) el.value = cls[c.key] || 0; 
      });
      document.getElementById("inputOvertime").value = r.get("overtime") || 0;
      document.getElementById("inputTimeoff").value = r.get("timeoff") || 0;
    }
  } catch (e) { console.error("Error loading day data:", e); }
  
  document.getElementById("editModal").style.display = "block";
}

function closeModal(){ document.getElementById("editModal").style.display="none"; }

async function saveDayData(){
  const btn = document.getElementById("saveBtn");
  btn.disabled = true; 
  btn.textContent = "Saving...";
  
  try {
    const cls = {};
    classTypes.forEach(c => {
      const el = document.getElementById(`sel_${c.key}`);
      cls[c.key] = el ? parseInt(el.value) : 0;
    });
    
    const otValue = Number(document.getElementById("inputOvertime").value) || 0;
    const toValue = Number(document.getElementById("inputTimeoff").value) || 0;

    const parts = selectedDate.split('-');
    const start = new Date(parts[0], parts[1]-1, parts[2], 0, 0, 0);
    const end = new Date(parts[0], parts[1]-1, parts[2], 23, 59, 59);

    let query = new AV.Query(TeachingRecord);
    query.greaterThanOrEqualTo("date", start);
    query.lessThanOrEqualTo("date", end);
    let r = await query.first();
    
    if(!r) r = new TeachingRecord();
    
    r.set("date", start);
    r.set("classes", cls);
    r.set("overtime", otValue); 
    r.set("timeoff", toValue);
    
    await r.save();
    closeModal();
    await refreshData();
  } catch (e) {
    console.error("Save failed:", e);
    alert("Save Error!");
  } finally { 
    btn.disabled = false; 
    btn.textContent = "Save Records"; 
  }
}

function changeMonth(delta){ 
  month += delta; 
  if(month < 0){ month = 11; year--; } 
  else if(month > 11){ month = 0; year++; } 
  renderCalendar(); 
}

window.onload = initApp;
</script>
</body>
</html>
