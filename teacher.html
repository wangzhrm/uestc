<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teaching Calendar</title>
  <script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.13.2/dist/av-min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      padding: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }
    h1, h2 {
      text-align: center;
      color: #2c3e50;
    }
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 1.2em;
    }
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 30px;
    }
    .day-header {
      text-align: center;
      font-weight: bold;
      padding: 8px;
      background: #e0e0e0;
      border-radius: 4px;
    }
    .date-cell {
      height: 80px;
      background: white;
      border: 1px solid #ddd;
      padding: 4px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .date-number {
      font-weight: bold;
      margin-bottom: 4px;
    }
    .class-summary {
      font-size: 0.85em;
      color: #27ae60;
    }
    .other-month {
      background: #f0f0f0;
      color: #aaa;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
    }
    .modal-content {
      background: white;
      margin: 10% auto;
      padding: 20px;
      width: 90%;
      max-width: 500px;
      border-radius: 8px;
    }
    .modal h3 {
      margin-top: 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 15px 0;
    }
    th, td {
      padding: 8px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    select {
      width: 100%;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .btn {
      padding: 8px 16px;
      margin: 5px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .save-btn { background: #27ae60; color: white; }
    .cancel-btn { background: #e74c3c; color: white; }
    .summary-box {
      background: #f0f7ff;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
    }
    .summary-label {
      font-weight: bold;
    }
    .period-input {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 20px 0;
    }
    .period-input input {
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<h1>Teaching Calendar</h1>

<div class="nav">
  <button onclick="prevMonth()">&lt; Previous</button>
  <div id="currentMonth">January 2025</div>
  <button onclick="nextMonth()">Next &gt;</button>
</div>

<div class="calendar" id="calendarGrid">
  <!-- Calendar will be generated here -->
</div>

<!-- Custom Period Summary Section -->
<div class="summary-box">
  <h2>Custom Period Summary</h2>
  <div class="period-input">
    <input type="date" id="startDateInput" />
    <input type="date" id="endDateInput" />
    <button class="btn save-btn" onclick="loadPeriodSummary()">Load Summary</button>
  </div>
  <div id="customSummary"></div>
</div>

<!-- Monthly Summary -->
<div class="summary-box">
  <h2>Monthly Summary</h2>
  <div id="monthlySummary"></div>
</div>

<!-- Modal -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <h3>Edit Classes for <span id="modalDate"></span></h3>
    <table id="modalTable">
      <!-- Dynamically filled -->
    </table>
    <button class="btn save-btn" onclick="saveDayData()">Save</button>
    <button class="cancel-btn" onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
  // Initialize LeanCloud
  AV.init({
    appId: "qqGQwbksBnwD2Dbdajp1jLZY-gzGzoHsz",
    appKey: "SMx2RHGXoV82nuXnreLNzLhm",
    serverURL: "https://qqgqwbks.lc-cn-n1-shared.com"
  });

  const TeachingRecord = AV.Object.extend('TeachingRecord');
  const ClassType = AV.Object.extend('ClassType');

  let currentDate = new Date();
  let currentYear = currentDate.getFullYear();
  let currentMonth = currentDate.getMonth(); // 0 = Jan
  let selectedDate = null; // "YYYY-MM-DD"
  let classTypes = []; // Loaded from DB

  // Fetch class types once
  async function loadClassTypes() {
    const query = new AV.Query(ClassType);
    query.limit(100);
    try {
      const results = await query.find();
      classTypes = results.map(obj => ({
        id: obj.id,
        name: obj.get('name'),
        hoursPerSession: obj.get('hoursPerSession') // ✅ CORRECT FIELD NAME
      }));
      renderCalendar();
    } catch (err) {
      console.error("Failed to load class types:", err);
      alert("Error loading class types. Check console.");
    }
  }

  function formatDateForId(date) {
    if (typeof date === 'string') return date;
    const d = new Date(date);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function renderCalendar() {
    const monthNames = ["January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"];
    document.getElementById('currentMonth').textContent = `${monthNames[currentMonth]} ${currentYear}`;

    const firstDay = new Date(currentYear, currentMonth, 1);
    const lastDay = new Date(currentYear, currentMonth + 1, 0);
    const daysInMonth = lastDay.getDate();
    const startDayOfWeek = firstDay.getDay();

    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';

    ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(day => {
      const header = document.createElement('div');
      header.className = 'day-header';
      header.textContent = day;
      grid.appendChild(header);
    });

    const prevMonthLastDay = new Date(currentYear, currentMonth, 0).getDate();
    for (let i = startDayOfWeek - 1; i >= 0; i--) {
      const dayDiv = document.createElement('div');
      dayDiv.className = 'date-cell other-month';
      dayDiv.textContent = prevMonthLastDay - i;
      grid.appendChild(dayDiv);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const dayDiv = document.createElement('div');
      dayDiv.className = 'date-cell';
      const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      dayDiv.dataset.date = dateStr;
      dayDiv.innerHTML = `<div class="date-number">${day}</div><div class="class-summary" id="summary-${dateStr}"></div>`;
      dayDiv.onclick = () => openEditModal(dateStr);
      grid.appendChild(dayDiv);
    }

    const totalCells = 42;
    const remaining = totalCells - (startDayOfWeek + daysInMonth);
    for (let day = 1; day <= remaining; day++) {
      const dayDiv = document.createElement('div');
      dayDiv.className = 'date-cell other-month';
      dayDiv.textContent = day;
      grid.appendChild(dayDiv);
    }

    loadMonthData();
  }

  async function loadMonthData() {
    const startDate = new Date(currentYear, currentMonth, 1);
    const endDate = new Date(currentYear, currentMonth + 1, 0);
    endDate.setHours(23, 59, 59, 999);

    const query = new AV.Query(TeachingRecord);
    query.greaterThanOrEqualTo('date', startDate);
    query.lessThanOrEqualTo('date', endDate);
    const results = await query.find();

    document.querySelectorAll('.class-summary').forEach(el => el.textContent = '');

    const totals = {};
    classTypes.forEach(ct => {
      totals[ct.name] = { count: 0, hours: 0 };
    });

    results.forEach(record => {
      const date = record.get('date');
      const dateStr = formatDateForId(date);
      const classes = record.get('classes') || {};

      let totalClasses = 0;
      for (const ct of classTypes) {
        const count = classes[ct.name] || 0;
        totals[ct.name].count += count;
        totals[ct.name].hours += count * ct.hoursPerSession; // ✅ Use hoursPerSession
        totalClasses += count;
      }

      if (totalClasses > 0) {
        const summaryEl = document.getElementById(`summary-${dateStr}`);
        if (summaryEl) summaryEl.textContent = `${totalClasses} class${totalClasses !== 1 ? 'es' : ''}`;
      }
    });

    renderSummary(totals, 'monthlySummary');
  }

  async function loadPeriodSummary() {
    const startInput = document.getElementById('startDateInput').value;
    const endInput = document.getElementById('endDateInput').value;
    if (!startInput || !endInput) {
      alert("Please select both start and end dates.");
      return;
    }

    const startDate = new Date(startInput);
    const endDate = new Date(endInput);
    endDate.setHours(23, 59, 59, 999);

    const query = new AV.Query(TeachingRecord);
    query.greaterThanOrEqualTo('date', startDate);
    query.lessThanOrEqualTo('date', endDate);
    const results = await query.find();

    const totals = {};
    classTypes.forEach(ct => {
      totals[ct.name] = { count: 0, hours: 0 };
    });

    results.forEach(record => {
      const classes = record.get('classes') || {};
      for (const ct of classTypes) {
        const count = classes[ct.name] || 0;
        totals[ct.name].count += count;
        totals[ct.name].hours += count * ct.hoursPerSession; // ✅ Correct field
      }
    });

    renderSummary(totals, 'customSummary');
  }

  function renderSummary(totals, containerId) {
    let totalCount = 0;
    let totalHours = 0;
    let html = '';

    for (const ct of classTypes) {
      const { count, hours } = totals[ct.name];
      totalCount += count;
      totalHours += hours;
      html += `
        <div class="summary-row">
          <span class="summary-label">${ct.name} Classes:</span>
          <span>${count}</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">${ct.name} Hours:</span>
          <span>${hours.toFixed(2)}</span>
        </div>
      `;
    }

    html += `
      <div class="summary-row">
        <span class="summary-label">Total Classes:</span>
        <span>${totalCount}</span>
      </div>
      <div class="summary-row">
        <span class="summary-label">Total Hours:</span>
        <span>${totalHours.toFixed(2)}</span>
      </div>
    `;

    document.getElementById(containerId).innerHTML = html;
  }

  async function openEditModal(dateStr) {
    selectedDate = dateStr;
    document.getElementById('modalDate').textContent = dateStr;

    let tableHtml = '<tr><th>Type</th><th>Classes / Hours</th></tr>';
    for (const ct of classTypes) {
      let optionsHtml = '';
      for (let i = 0; i <= 8; i++) {
        const hours = (i * ct.hoursPerSession).toFixed(2); // ✅ Use hoursPerSession
        optionsHtml += `<option value="${i}">${i} (${hours}h)</option>`;
      }
      const safeName = ct.name.replace(/\s+/g, '_').replace(/[^a-zA-Z0-9_]/g, '');
      tableHtml += `
        <tr>
          <td>${ct.name} (${ct.hoursPerSession}h/session)</td>
          <td><select id="select-${safeName}">${optionsHtml}</select></td>
        </tr>
      `;
    }
    document.getElementById('modalTable').innerHTML = tableHtml;

    const query = new AV.Query(TeachingRecord);
    query.equalTo('date', new Date(dateStr));
    const results = await query.find();
    if (results.length > 0) {
      const classes = results[0].get('classes') || {};
      for (const ct of classTypes) {
        const safeName = ct.name.replace(/\s+/g, '_').replace(/[^a-zA-Z0-9_]/g, '');
        const val = classes[ct.name] || 0;
        document.getElementById(`select-${safeName}`).value = String(val);
      }
    }

    document.getElementById('editModal').style.display = 'block';
  }

  function closeModal() {
    document.getElementById('editModal').style.display = 'none';
    selectedDate = null;
  }

  async function saveDayData() {
    if (!selectedDate) return;

    const classes = {};
    for (const ct of classTypes) {
      const safeName = ct.name.replace(/\s+/g, '_').replace(/[^a-zA-Z0-9_]/g, '');
      classes[ct.name] = parseInt(document.getElementById(`select-${safeName}`).value);
    }

    const query = new AV.Query(TeachingRecord);
    query.equalTo('date', new Date(selectedDate));
    const existing = await query.find();

    if (existing.length > 0) {
      existing[0].set('classes', classes);
      await existing[0].save();
    } else {
      const obj = new TeachingRecord();
      obj.set('date', new Date(selectedDate));
      obj.set('classes', classes);
      await obj.save();
    }

    closeModal();
    loadMonthData();
  }

  function prevMonth() {
    if (currentMonth === 0) {
      currentYear--;
      currentMonth = 11;
    } else {
      currentMonth--;
    }
    renderCalendar();
  }

  function nextMonth() {
    if (currentMonth === 11) {
      currentYear++;
      currentMonth = 0;
    } else {
      currentMonth++;
    }
    renderCalendar();
  }

  window.onclick = function(event) {
    const modal = document.getElementById('editModal');
    if (event.target === modal) closeModal();
  };

  // Start loading class types on page load
  loadClassTypes();
</script>

</body>
</html>
