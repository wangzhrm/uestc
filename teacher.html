<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Teaching Calendar</title>

<script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.13.2/dist/av-min.js"></script>

<style>
body { font-family: Arial, sans-serif; background: #f9f9f9; padding: 20px; max-width: 1000px; margin:auto; }
h1 { text-align:center; }
.nav { display:flex; justify-content:space-between; margin-bottom:15px; }
.calendar { display:grid; grid-template-columns: repeat(7,1fr); gap:4px; }
.day-header { text-align:center; font-weight:bold; background:#e0e0e0; padding:6px; }
.date-cell { background:white; border:1px solid #ddd; min-height:95px; padding:4px; cursor:pointer; }
.other-month { background:#f1f1f1; }
.date-number { font-weight:bold; font-size:0.9em; }
.class-summary { margin-top:4px; font-size:0.75em; line-height:1.3; color:#2c3e50; }
@media (max-width:600px){ .class-summary{ font-size:0.6em; line-height:1.2; } }
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); }
.modal-content { background:white; margin:10% auto; padding:20px; max-width:500px; border-radius:8px; }
table { width:100%; border-collapse:collapse; margin-top:15px; }
td, th { padding:6px; border:1px solid #ddd; text-align:center; }
select { width:100%; }
button { padding:8px 14px; margin-top:10px; cursor:pointer; }
.summary-box { background:#f0f7ff; padding:15px; border-radius:8px; margin-top:20px; }
</style>
</head>

<body>

<h1>Teaching Calendar</h1>

<div class="nav">
  <button onclick="prevMonth()">&lt;</button>
  <div id="currentMonth"></div>
  <button onclick="nextMonth()">&gt;</button>
</div>

<div class="calendar" id="calendarGrid"></div>

<div class="summary-box">
  <h2>Monthly Summary</h2>
  <div id="monthlySummaryContainer"></div>
</div>

<div class="modal" id="editModal">
  <div class="modal-content">
    <h3 id="modalDate"></h3>
    <table id="modalTable"></table>
    <button onclick="saveDayData()">Save</button>
    <button onclick="closeModal()">Cancel</button>
  </div>
</div>

<script>
/* ========== LeanCloud Init ========== */
AV.init({
  appId: "qqGQwbksBnwD2Dbdajp1jLZY-gzGzoHsz",
  appKey: "SMx2RHGXoV82nuXnreLNzLhm",
  serverURL: "https://qqgqwbks.lc-cn-n1-shared.com"
});

const TeachingRecord = AV.Object.extend("TeachingRecord");
const ClassType = AV.Object.extend("ClassType");

let current = new Date();
let year = current.getFullYear();
let month = current.getMonth();
let classTypes = [];
let selectedDate = "";

/* ========== Helpers ========== */
function formatLocalDate(date){
  const y=date.getFullYear(), m=String(date.getMonth()+1).padStart(2,"0"), d=String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}
function dayRange(dateStr){
  const d=new Date(dateStr);
  const start=new Date(d.setHours(0,0,0,0));
  const end=new Date(d.setHours(23,59,59,999));
  return {start,end};
}

/* ========== Load Class Types ========== */
async function loadClassTypes(){
  const res=await new AV.Query(ClassType).find();
  classTypes=res.map(o=>({
    name:o.get("name"),
    key:o.get("name").replace(/[^a-zA-Z0-9_]/g,"_"),
    hoursPerSession:o.get("hoursPerSession")
  }));
  renderCalendar();
}

/* ========== Calendar ========== */
function renderCalendar(){
  const grid=document.getElementById("calendarGrid");
  grid.innerHTML="";
  document.getElementById("currentMonth").textContent=`${year}-${String(month+1).padStart(2,"0")}`;
  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(d=>{
    const h=document.createElement("div"); h.className="day-header"; h.textContent=d; grid.appendChild(h);
  });
  const firstDay=new Date(year,month,1).getDay();
  const days=new Date(year,month+1,0).getDate();
  for(let i=0;i<firstDay;i++){grid.appendChild(document.createElement("div")).className="date-cell other-month";}
  for(let d=1;d<=days;d++){
    const dateStr=`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const cell=document.createElement("div");
    cell.className="date-cell";
    cell.innerHTML=`<div class="date-number">${d}</div><div class="class-summary" id="summary-${dateStr}"></div>`;
    cell.onclick=()=>openModal(dateStr);
    grid.appendChild(cell);
  }
  loadMonthData();
}

/* ========== Load Month Data & Monthly Summary ========== */
async function loadMonthData(){
  const start=new Date(year,month,1);
  const end=new Date(year,month+1,0,23,59,59,999);
  const q=new AV.Query(TeachingRecord);
  q.greaterThanOrEqualTo("date",start);
  q.lessThanOrEqualTo("date",end);
  const res=await q.find();

  document.querySelectorAll(".class-summary").forEach(e=>e.innerHTML="");

  // Prepare totals
  const totals={};
  let grandTotalHours=0;
  classTypes.forEach(c=>totals[c.key]={count:0,hours:0});

  res.forEach(r=>{
    const keyDate=formatLocalDate(r.get("date"));
    const classes=r.get("classes")||{};
    const el=document.getElementById(`summary-${keyDate}`);
    if(el){
      let html="";
      classTypes.forEach(c=>{
        const n=classes[c.key]||0;
        if(n>0){
          html+=`${c.name} ×${n}<br>`;
          totals[c.key].count+=n;
          totals[c.key].hours+=n*c.hoursPerSession;
          grandTotalHours+=n*c.hoursPerSession;
        }
      });
      el.innerHTML=html;
    }
  });

  // Render monthly summary table
  let html=`<table><tr><th>Class Type</th><th>Total Classes</th><th>Total Hours</th><th rowspan="${classTypes.length}">Grand Total<br>${grandTotalHours.toFixed(2)}h</th></tr>`;
  classTypes.forEach((c,i)=>{
    html+=`<tr><td>${c.name}</td><td>${totals[c.key].count}</td><td>${totals[c.key].hours.toFixed(2)}</td></tr>`;
  });
  html+=`</table>`;
  document.getElementById("monthlySummaryContainer").innerHTML=html;
}

/* ========== Modal ========== */
async function openModal(dateStr){
  selectedDate = dateStr;
  document.getElementById("modalDate").textContent = dateStr;
  let html = "<tr><th>Class</th><th>Count</th></tr>";

  // Show simplified hours (1h, 0.75h, 0.5h)
  classTypes.forEach(c=>{
    let opts = ""; 
    for(let i=0;i<=8;i++) opts += `<option>${i}</option>`;
    html += `<tr>
               <td>${c.name} (${c.hoursPerSession}h)</td>
               <td><select id="${c.key}">${opts}</select></td>
             </tr>`;
  });

  modalTable.innerHTML = html;

  const {start,end} = dayRange(dateStr);
  const q = new AV.Query(TeachingRecord);
  q.greaterThanOrEqualTo("date", start);
  q.lessThanOrEqualTo("date", end);
  const r = await q.first();
  if(r){
    const cls = r.get("classes") || {};
    classTypes.forEach(c => document.getElementById(c.key).value = cls[c.key] || 0);
  }

  editModal.style.display = "block";
}
function closeModal(){ editModal.style.display="none"; }

/* ========== Save ========== */
async function saveDayData(){
  const classes={};
  classTypes.forEach(c=>classes[c.key]=parseInt(document.getElementById(c.key).value));
  const {start,end}=dayRange(selectedDate);
  let r=await new AV.Query(TeachingRecord).greaterThanOrEqualTo("date",start).lessThanOrEqualTo("date",end).first();
  if(!r) r=new TeachingRecord();
  r.set("date",start);
  r.set("classes",classes);
  await r.save();
  closeModal();
  loadMonthData();
}

/* ========== Navigation ========== */
function prevMonth(){ month--; if(month<0){month=11;year--;} renderCalendar(); }
function nextMonth(){ month++; if(month>11){month=0;year++;} renderCalendar(); }

loadClassTypes();
</script>

</body>
</html>
