<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Portal v3 - Fixed Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background: #020617; color: #f1f5f9; font-family: 'Inter', sans-serif; }
        .hidden { display: none !important; }
        
        /* Persistent Hierarchy Styles */
        .folder-content { display: none; padding-left: 1.25rem; border-left: 1px solid #1e293b; margin-left: 0.75rem; }
        .folder-open > .folder-content { display: block; }
        .chevron { transition: transform 0.2s; font-size: 10px; }
        .folder-open > .folder-header .chevron { transform: rotate(90deg); }

        /* Professional Video Display */
        .video-box { background: #0f172a; border-radius: 1.5rem; padding: 1.5rem; border: 1px solid #1e293b; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); margin-bottom: 2rem; }
        .custom-video-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; background: #000; border-radius: 1rem; overflow: hidden; margin-top: 1rem; }
        .custom-video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

        /* Thumbnail Overlay */
        .video-thumbnail { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; cursor: pointer; transition: filter 0.3s; }
        .video-thumbnail:hover { filter: brightness(1.1); }
        .play-button-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 68px; height: 48px; background-color: #6366f1; border-radius: 14px; display: flex; align-items: center; justify-content: center; z-index: 10; pointer-events: none; }
        .play-button-overlay::before { content: ''; border-style: solid; border-width: 8px 0 8px 14px; border-color: transparent transparent transparent #fff; margin-left: 4px; }
    </style>
</head>
<body class="p-4 md:p-12">

    <div id="selectorView" class="max-w-4xl mx-auto mt-10">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-black text-white tracking-tighter">STUDY<span class="text-indigo-500">HUB</span></h1>
            <button id="openAdmin" class="bg-indigo-600 hover:bg-indigo-500 px-6 py-2 rounded-full font-bold transition flex items-center gap-2">
                <i class="fas fa-lock"></i> Admin
            </button>
        </div>
        <div class="bg-slate-900/50 p-8 rounded-[2rem] border border-slate-800 backdrop-blur-sm">
            <h2 class="text-lg font-bold mb-6 text-slate-400">Select Your Lecture</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <select id="uSelect" class="bg-slate-950 p-4 rounded-xl border border-slate-800 outline-none focus:ring-2 focus:ring-indigo-500"></select>
                <select id="lSelect" class="bg-slate-950 p-4 rounded-xl border border-slate-800 outline-none focus:ring-2 focus:ring-indigo-500 disabled:opacity-30" disabled></select>
            </div>
            <button id="launchBtn" class="w-full bg-white text-black p-5 rounded-2xl font-black text-lg hover:bg-indigo-400 hover:text-white transition">START LEARNING</button>
        </div>
    </div>

    <div id="adminModal" class="fixed inset-0 bg-black/98 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 w-full max-w-6xl h-[90vh] rounded-[2.5rem] flex flex-col md:flex-row overflow-hidden border border-slate-800">
            <div class="w-full md:w-5/12 border-r border-slate-800 flex flex-col">
                <div class="p-6 border-b border-slate-800 flex justify-between items-center bg-slate-950/30">
                    <span class="text-xs font-black tracking-widest text-indigo-400">STRUCTURE</span>
                    <button onclick="window.ui.openForm('UNIT')" class="text-xs bg-indigo-600 px-3 py-1 rounded-lg hover:bg-indigo-500">+ Unit</button>
                </div>
                <div id="navTree" class="flex-1 overflow-y-auto p-6 custom-scroll"></div>
            </div>

            <div class="w-full md:w-7/12 p-12 relative flex flex-col justify-center">
                <button onclick="window.ui.closeAdmin()" class="absolute top-8 right-8 text-slate-500 hover:text-white"><i class="fas fa-times text-2xl"></i></button>
                <form id="dataForm" class="hidden space-y-8">
                    <input type="hidden" id="fType"><input type="hidden" id="fId"><input type="hidden" id="fParentId">
                    <h3 id="formTitle" class="text-2xl font-bold">Edit Entry</h3>
                    <div class="space-y-2">
                        <label class="text-xs font-bold text-slate-500 uppercase">Title</label>
                        <input type="text" id="fName" required class="w-full bg-slate-950 p-4 rounded-xl border border-slate-800 outline-none focus:border-indigo-500">
                    </div>
                    <div id="embedInputGroup" class="hidden space-y-2">
                        <label class="text-xs font-bold text-slate-500 uppercase">YouTube Link</label>
                        <input type="text" id="fEmbed" placeholder="https://www.youtube.com/watch?v=..." class="w-full bg-slate-950 p-4 rounded-xl border border-slate-800 outline-none focus:border-indigo-500 font-mono text-xs">
                    </div>
                    <div class="flex gap-4">
                        <button type="submit" class="flex-1 bg-indigo-600 p-4 rounded-xl font-bold hover:bg-indigo-500 shadow-xl shadow-indigo-500/20">Save</button>
                        <button type="button" id="delBtn" class="bg-red-500/10 text-red-500 px-8 rounded-xl border border-red-500/20 hover:bg-red-500 hover:text-white transition">Delete</button>
                    </div>
                </form>
                <div id="formIdle" class="text-center opacity-20"><i class="fas fa-layer-group text-7xl mb-6"></i><p class="text-lg">Select a component to modify</p></div>
            </div>
        </div>
    </div>

    <div id="viewerOverlay" class="fixed inset-0 bg-slate-950 z-[100] hidden overflow-y-auto p-6 md:p-16">
        <div class="max-w-4xl mx-auto">
            <button onclick="window.ui.closeViewer()" class="mb-12 text-slate-400 hover:text-white flex items-center gap-2 font-bold uppercase tracking-tighter"><i class="fas fa-arrow-left"></i> Exit Classroom</button>
            <div id="vContainer"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://btwdbphheotbqrmbswgk.supabase.co";
        const SUPABASE_KEY = "sb_publishable_9lY3A1HrgERNIC597NEAKQ_YTCmkh2k";
        const _db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let store = [];
        let openNodes = new Set();

        function extractVideoId(input) {
            if (!input) return null;
            const patterns = [/(?:src="|src='|embed\/)([a-zA-Z0-9_-]{11})/, /[?&]v=([a-zA-Z0-9_-]{11})/, /youtu\.be\/([a-zA-Z0-9_-]{11})/, /embed\/([a-zA-Z0-9_-]{11})/];
            for (let pattern of patterns) {
                const match = input.match(pattern);
                if (match && match[1]) return match[1];
            }
            return null;
        }

        const logic = {
            async sync() {
                const { data } = await _db.from('units').select(`id, name, created_at, lectures (id, name, created_at, videos (id, name, embed, created_at))`).order('created_at', { ascending: true });
                store = data || [];
                window.ui.renderAll();
            }
        };

        window.ui = {
            renderAll() {
                // Selector
                const us = document.getElementById('uSelect');
                us.innerHTML = '<option value="">-- Choose Unit --</option>';
                store.forEach(u => us.innerHTML += `<option value="${u.id}">${u.name}</option>`);

                // Tree
                const tree = document.getElementById('navTree');
                tree.innerHTML = '';
                store.forEach(u => {
                    const isOpen = openNodes.has(u.id);
                    let h = `<div class="folder-node ${isOpen ? 'folder-open' : ''}" id="node-${u.id}">
                        <div class="folder-header flex justify-between items-center py-2 hover:bg-slate-800/50 rounded-lg cursor-pointer group px-2">
                            <div class="flex items-center gap-3 flex-1" onclick="window.ui.toggleNode('${u.id}')">
                                <i class="fas fa-chevron-right text-indigo-500 chevron"></i>
                                <span class="text-xs font-black uppercase text-slate-300">${u.name}</span>
                            </div>
                            <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition">
                                <button onclick="window.ui.openForm('LECTURE', '', '${u.id}')" class="text-[9px] font-bold text-emerald-400">+ LEC</button>
                                <button class="edit-btn text-slate-500" data-type="UNIT" data-id="${u.id}" data-name="${u.name}"><i class="fas fa-pen"></i></button>
                            </div>
                        </div>
                        <div class="folder-content">`;
                    
                    (u.lectures || []).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).forEach(l => {
                        const lOpen = openNodes.has(l.id);
                        h += `<div class="folder-node mt-2 ${lOpen ? 'folder-open' : ''}" id="node-${l.id}">
                            <div class="folder-header flex justify-between items-center py-1 hover:bg-slate-800/30 rounded px-2 group cursor-pointer">
                                <div class="flex items-center gap-2 flex-1" onclick="window.ui.toggleNode('${l.id}')">
                                    <i class="fas fa-chevron-right text-slate-600 chevron"></i>
                                    <span class="text-xs font-bold text-slate-400">${l.name}</span>
                                </div>
                                <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition">
                                    <button onclick="window.ui.openForm('VIDEO', '', '${l.id}')" class="text-[9px] font-bold text-indigo-400">+ VID</button>
                                    <button class="edit-btn text-slate-600" data-type="LECTURE" data-id="${l.id}" data-pid="${u.id}" data-name="${l.name}"><i class="fas fa-pen"></i></button>
                                </div>
                            </div>
                            <div class="folder-content">`;
                        
                        (l.videos || []).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).forEach(v => {
                            h += `<div class="flex justify-between items-center py-2 text-[11px] text-slate-500 group hover:text-white transition px-2">
                                <span><i class="fas fa-play mr-2 opacity-30"></i>${v.name}</span>
                                <button class="edit-btn text-indigo-500 opacity-0 group-hover:opacity-100" data-type="VIDEO" data-id="${v.id}" data-pid="${l.id}" data-name="${v.name}" data-embed="${(v.embed || '').replace(/"/g, '&quot;')}"><i class="fas fa-pen"></i></button>
                            </div>`;
                        });
                        h += `</div></div>`;
                    });
                    h += `</div></div>`;
                    tree.innerHTML += h;
                });

                // Attach Event Listeners to Pen Buttons (Prevents eval/quote errors)
                document.querySelectorAll('.edit-btn').forEach(btn => {
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        const d = btn.dataset;
                        window.ui.openForm(d.type, d.id, d.pid || '', d.name, d.embed || '');
                    };
                });
            },

            toggleNode(id) {
                const node = document.getElementById(`node-${id}`);
                if (openNodes.has(id)) openNodes.delete(id); else openNodes.add(id);
                node.classList.toggle('folder-open');
            },

            openForm(type, id='', pId='', name='', embed='') {
                document.getElementById('formIdle').classList.add('hidden');
                document.getElementById('dataForm').classList.remove('hidden');
                document.getElementById('fType').value = type;
                document.getElementById('fId').value = id;
                document.getElementById('fParentId').value = pId;
                document.getElementById('fName').value = name;
                document.getElementById('fEmbed').value = embed;
                document.getElementById('embedInputGroup').classList.toggle('hidden', type !== 'VIDEO');
                document.getElementById('delBtn').classList.toggle('hidden', !id);
                document.getElementById('formTitle').innerText = (id ? 'Update ' : 'New ') + type;
            },

            closeAdmin() { document.getElementById('adminModal').classList.add('hidden'); },
            closeViewer() { document.getElementById('viewerOverlay').classList.add('hidden'); document.getElementById('vContainer').innerHTML = ''; }
        };

        // Player UI
        function createStablePlayer(videoId) {
            const wrapper = document.createElement('div');
            wrapper.className = 'custom-video-wrapper';
            const thumb = document.createElement('div');
            thumb.className = 'video-thumbnail';
            thumb.style.backgroundImage = `url('https://img.youtube.com/vi/${videoId}/maxresdefault.jpg')`;
            const playBtn = document.createElement('div');
            playBtn.className = 'play-button-overlay';
            wrapper.appendChild(thumb);
            wrapper.appendChild(playBtn);
            thumb.onclick = () => {
                wrapper.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            };
            return wrapper;
        }

        document.getElementById('uSelect').onchange = (e) => {
            const ls = document.getElementById('lSelect');
            const unit = store.find(u => u.id === e.target.value);
            ls.innerHTML = '<option value="">-- Choose Lecture --</option>';
            if (!unit) return ls.disabled = true;
            ls.disabled = false;
            (unit.lectures || []).forEach(l => ls.innerHTML += `<option value="${l.id}">${l.name}</option>`);
        };

        document.getElementById('launchBtn').onclick = () => {
            const uId = document.getElementById('uSelect').value;
            const lId = document.getElementById('lSelect').value;
            if (!lId) return;
            const lecture = store.find(u => u.id === uId).lectures.find(l => l.id === lId);
            const container = document.getElementById('vContainer');
            container.innerHTML = '';
            (lecture.videos || []).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).forEach(v => {
                const box = document.createElement('div');
                box.className = "video-box";
                box.innerHTML = `<h3 class="text-xl font-black text-indigo-400 uppercase tracking-widest">${v.name}</h3>`;
                const id = extractVideoId(v.embed);
                if (id) box.appendChild(createStablePlayer(id));
                container.appendChild(box);
            });
            document.getElementById('viewerOverlay').classList.remove('hidden');
        };

        document.getElementById('dataForm').onsubmit = async (e) => {
            e.preventDefault();
            const type = document.getElementById('fType').value;
            const id = document.getElementById('fId').value;
            const table = type.toLowerCase() + 's';
            const payload = { 
                name: document.getElementById('fName').value,
                ...(type === 'LECTURE' && { unit_id: document.getElementById('fParentId').value }),
                ...(type === 'VIDEO' && { lecture_id: document.getElementById('fParentId').value, embed: document.getElementById('fEmbed').value })
            };
            if (id) await _db.from(table).update(payload).eq('id', id); else await _db.from(table).insert([payload]);
            await logic.sync();
            document.getElementById('dataForm').classList.add('hidden');
        };

        document.getElementById('delBtn').onclick = async () => {
            if (!confirm("Delete?")) return;
            await _db.from(document.getElementById('fType').value.toLowerCase() + 's').delete().eq('id', document.getElementById('fId').value);
            await logic.sync();
            document.getElementById('dataForm').classList.add('hidden');
        };

        document.getElementById('openAdmin').onclick = () => document.getElementById('adminModal').classList.remove('hidden');
        logic.sync();
    </script>
</body>
</html>
