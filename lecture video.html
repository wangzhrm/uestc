<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyHub v11 - Drag & Tactile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { background-color: #f3f4f6; color: #1f2937; font-family: 'Inter', sans-serif; min-height: 100vh; }
        .hidden { display: none !important; }
        
        /* Tactile Feedback Animation */
        button, .clickable-card, .video-box {
            transition: transform 0.1s active, box-shadow 0.2s;
        }
        button:active, .clickable-card:active, .video-box:active {
            transform: scale(0.96);
        }

        .clickable-card { display: flex; width: 100%; align-items: center; border: 1px solid #e5e7eb; background: white; border-radius: 0.75rem; position: relative; overflow: hidden; margin-bottom: 0.5rem;}
        .active-lecture { border-color: #6366f1; background-color: #eef2ff; border-width: 2px; }
        
        .drag-handle { cursor: grab; padding: 1rem; color: #cbd5e1; display: flex; align-items: center; }
        .drag-handle:active { cursor: grabbing; }
        
        .card-main { flex: 1; padding: 1rem; display: flex; align-items: center; cursor: pointer; }
        .card-action { padding: 1rem; display: flex; align-items: center; justify-content: center; color: #94a3b8; border-left: 1px solid #f1f5f9; cursor: pointer; }
        
        /* Sortable Ghosting */
        .sortable-ghost { opacity: 0.4; background: #e0e7ff; border: 2px dashed #6366f1; }
        
        .video-box { background: #ffffff; border-radius: 1rem; padding: 1.5rem; border: 1px solid #e5e7eb; margin-bottom: 2rem; cursor: pointer; }
    </style>
</head>
<body class="p-4 md:p-12">

    <div id="selectorView" class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-10">
            <h1 class="text-3xl font-black text-slate-800 tracking-tighter">STUDY<span class="text-indigo-600">HUB</span></h1>
            <button id="openAdmin" class="bg-slate-800 hover:bg-slate-700 text-white px-6 py-2 rounded-lg font-bold shadow-md">
                <i class="fas fa-user-shield mr-2"></i> Admin Portal
            </button>
        </div>

        <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm mb-8 text-center">
            <h2 class="text-xs font-black mb-4 text-slate-400 uppercase tracking-widest">Select Subject Unit</h2>
            <select id="uSelect" class="w-full bg-slate-50 p-4 rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-indigo-500 text-slate-700 font-medium"></select>
        </div>
        <div id="lectureFolderContainer" class="space-y-4"></div>
    </div>

    <div id="adminModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-5xl h-[85vh] rounded-3xl flex flex-col overflow-hidden shadow-2xl">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <h2 class="text-xl font-bold text-slate-800">Content Management</h2>
                <button onclick="window.ui.closeAdmin()" class="text-slate-400 hover:text-red-500 p-2"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="flex flex-1 overflow-hidden">
                <div class="w-1/3 border-r border-slate-100 bg-slate-50 p-4 flex flex-col">
                    <select id="adminUnitSelect" class="w-full bg-white p-3 rounded-lg border border-slate-200 text-sm mb-6 outline-none"></select>
                    <div id="adminLectureList" class="flex-1 overflow-y-auto pt-2"></div>
                    <button onclick="window.ui.openForm('UNIT')" class="mt-4 w-full py-2 text-xs font-bold text-indigo-600 border border-indigo-200 rounded-lg hover:bg-white">+ New Unit</button>
                </div>
                <div class="w-2/3 p-8 overflow-y-auto bg-white relative">
                    <div id="adminVideoArea" class="hidden">
                        <div class="flex justify-between items-start mb-8 bg-slate-50 p-4 rounded-xl border border-slate-100">
                            <div>
                                <h3 id="activeLectureTitle" class="text-xl font-bold text-slate-800"></h3>
                                <button id="editLectureBtn" class="text-[10px] text-slate-400 hover:text-indigo-600 font-bold uppercase mt-2">Rename Lecture</button>
                            </div>
                            <button id="addVideoBtn" class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl text-xs font-bold hover:bg-indigo-700 transition">+ Add Video</button>
                        </div>
                        <div id="adminVideoList" class="space-y-1"></div>
                    </div>
                    <div id="adminFormArea" class="hidden">
                        <div class="max-w-md mx-auto bg-slate-50 border border-slate-200 p-8 rounded-3xl">
                            <form id="dataForm" class="space-y-5">
                                <input type="hidden" id="fId"><input type="hidden" id="fType"><input type="hidden" id="fParentId">
                                <h3 id="formTitle" class="text-sm font-black uppercase text-indigo-600 border-b border-indigo-100 pb-2">Edit</h3>
                                <div>
                                    <label class="text-[10px] font-bold text-slate-400 uppercase">Display Name</label>
                                    <input type="text" id="fName" required class="w-full bg-white p-4 rounded-xl border border-slate-200 outline-none focus:border-indigo-500">
                                </div>
                                <div id="embedInputGroup" class="hidden">
                                    <label class="text-[10px] font-bold text-slate-400 uppercase">YouTube Link</label>
                                    <textarea id="fEmbed" class="w-full bg-white p-4 rounded-xl border border-slate-200 outline-none font-mono text-xs focus:border-indigo-500" rows="3"></textarea>
                                </div>
                                <div class="flex flex-col gap-3 pt-6">
                                    <button type="submit" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold hover:bg-indigo-700 shadow-lg transition">Save Changes</button>
                                    <div class="flex gap-2">
                                        <button type="button" id="cancelForm" class="flex-1 bg-white border border-slate-200 text-slate-500 py-3 rounded-xl font-bold">Cancel</button>
                                        <button type="button" id="delBtn" class="bg-red-50 text-red-500 px-6 rounded-xl hover:bg-red-500 hover:text-white transition"><i class="fas fa-trash-alt"></i></button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                    <div id="adminIdle" class="h-full flex flex-col items-center justify-center text-slate-300 text-center">
                        <i class="fas fa-hand-pointer text-4xl mb-3"></i>
                        <p class="text-sm">Select a lecture, then drag items<br>to reorder them instantly.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="viewerOverlay" class="fixed inset-0 bg-white z-[200] hidden overflow-y-auto p-6 md:p-12">
        <div class="max-w-4xl mx-auto">
            <button onclick="window.ui.closeViewer()" class="mb-10 text-slate-400 hover:text-indigo-600 flex items-center gap-2 font-bold uppercase tracking-widest transition">
                <i class="fas fa-arrow-left"></i> Back to Portal
            </button>
            <div id="vContainer"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://btwdbphheotbqrmbswgk.supabase.co";
        const SUPABASE_KEY = "sb_publishable_9lY3A1HrgERNIC597NEAKQ_YTCmkh2k";
        const _db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let store = [];
        let currentUnitId = null;
        let activeLectureId = null;

        const utils = {
            extractVideoId(input) {
                if (!input) return "";
                let str = input.trim();
                const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
                const match = str.match(regex);
                return match ? match[1] : (str.match(/^[a-zA-Z0-9_-]{11}$/) ? str : "");
            },
            openInYouTube(id) { 
                this.haptic();
                if(id) window.open(`https://www.youtube.com/watch?v=${id}`, '_blank'); 
            },
            haptic() {
                if (navigator.vibrate) navigator.vibrate(10);
            }
        };

        const logic = {
            async sync() {
                const { data } = await _db.from('units').select(`id, name, created_at, lectures (id, name, created_at, videos (id, name, embed, created_at))`).order('created_at', { ascending: true });
                store = data || [];
                window.ui.renderMain();
                window.ui.renderAdminUnits();
            },
            async saveNewOrder(videoIds) {
                // We update timestamps sequentially to maintain the order in the database
                const baseTime = new Date();
                const updates = videoIds.map((id, index) => {
                    const newTime = new Date(baseTime.getTime() + index * 1000).toISOString();
                    return _db.from('videos').update({ created_at: newTime }).eq('id', id);
                });
                await Promise.all(updates);
                await this.sync();
            }
        };

        window.ui = {
            renderMain() {
                const us = document.getElementById('uSelect');
                const lastVal = us.value;
                us.innerHTML = '<option value="">-- Choose Subject --</option>';
                store.forEach(u => us.innerHTML += `<option value="${u.id}">${u.name}</option>`);
                us.value = lastVal;
            },
            renderAdminUnits() {
                const aus = document.getElementById('adminUnitSelect');
                aus.innerHTML = '<option value="">-- Select Unit --</option>';
                store.forEach(u => aus.innerHTML += `<option value="${u.id}">${u.name}</option>`);
            },
            loadAdminLectures(unitId) {
                currentUnitId = unitId;
                const list = document.getElementById('adminLectureList');
                list.innerHTML = '';
                const unit = store.find(u => u.id === unitId);
                if (!unit) return;
                unit.lectures.forEach(l => {
                    const btn = document.createElement('div');
                    btn.className = `clickable-card ${activeLectureId === l.id ? 'active-lecture' : ''}`;
                    btn.innerHTML = `<div class="card-main"><span class="text-sm font-semibold">${l.name}</span></div><div class="card-action"><i class="fas fa-chevron-right"></i></div>`;
                    btn.onclick = () => { utils.haptic(); window.ui.selectAdminLecture(unitId, l.id); };
                    list.appendChild(btn);
                });
            },
            selectAdminLecture(unitId, lectureId) {
                activeLectureId = lectureId;
                this.loadAdminLectures(unitId);
                document.getElementById('adminIdle').classList.add('hidden');
                document.getElementById('adminFormArea').classList.add('hidden');
                document.getElementById('adminVideoArea').classList.remove('hidden');
                const unit = store.find(u => u.id === unitId);
                const lecture = unit.lectures.find(l => l.id === lectureId);
                document.getElementById('activeLectureTitle').innerText = lecture.name;
                
                const vList = document.getElementById('adminVideoList');
                vList.innerHTML = '';
                
                const videos = (lecture.videos || []).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
                
                videos.forEach((v) => {
                    const row = document.createElement('div');
                    row.className = "clickable-card";
                    row.dataset.id = v.id;
                    row.innerHTML = `
                        <div class="drag-handle"><i class="fas fa-grip-vertical"></i></div>
                        <div class="card-main" onclick="utils.openInYouTube(utils.extractVideoId('${v.embed.replace(/'/g, "\\'")}'))">
                            <i class="fab fa-youtube text-red-600 mr-3"></i>
                            <span class="text-sm font-bold text-slate-700">${v.name}</span>
                        </div>
                        <div class="card-action" onclick="event.stopPropagation(); utils.haptic(); window.ui.openForm('VIDEO', '${v.id}', '${lectureId}', '${v.name.replace(/'/g, "\\'")}', '${v.embed.replace(/'/g, "\\'")}')">
                            <i class="fas fa-cog"></i>
                        </div>
                    `;
                    vList.appendChild(row);
                });

                // Initialize Drag and Drop
                new Sortable(vList, {
                    animation: 150,
                    handle: '.drag-handle',
                    ghostClass: 'sortable-ghost',
                    onEnd: async () => {
                        utils.haptic();
                        const newIds = Array.from(vList.children).map(el => el.dataset.id);
                        await logic.saveNewOrder(newIds);
                    }
                });
            },
            openForm(type, id='', pId='', name='', embed='') {
                utils.haptic();
                document.getElementById('adminVideoArea').classList.add('hidden');
                document.getElementById('adminIdle').classList.add('hidden');
                document.getElementById('adminFormArea').classList.remove('hidden');
                document.getElementById('fType').value = type;
                document.getElementById('fId').value = id;
                document.getElementById('fParentId').value = pId;
                document.getElementById('fName').value = name;
                document.getElementById('fEmbed').value = embed;
                document.getElementById('embedInputGroup').classList.toggle('hidden', type !== 'VIDEO');
                document.getElementById('delBtn').classList.toggle('hidden', !id);
                document.getElementById('formTitle').innerText = (id ? 'Update ' : 'New ') + type;
            },
            closeAdmin() { utils.haptic(); document.getElementById('adminModal').classList.add('hidden'); },
            closeViewer() { utils.haptic(); document.getElementById('viewerOverlay').classList.add('hidden'); document.getElementById('vContainer').innerHTML = ''; }
        };

        // Events
        document.getElementById('adminUnitSelect').onchange = (e) => { utils.haptic(); window.ui.loadAdminLectures(e.target.value); };
        document.getElementById('uSelect').onchange = (e) => {
            utils.haptic();
            const container = document.getElementById('lectureFolderContainer');
            container.innerHTML = ''; 
            const unit = store.find(u => u.id === e.target.value);
            if (!unit) return;
            unit.lectures.forEach(l => {
                const btn = document.createElement('div');
                btn.className = "clickable-card p-2";
                btn.innerHTML = `<div class="card-main"><h3 class="font-bold text-slate-800">${l.name}</h3></div><div class="card-action"><i class="fas fa-arrow-right"></i></div>`;
                btn.onclick = () => { utils.haptic(); launchLecture(unit.id, l.id); };
                container.appendChild(btn);
            });
        };

        window.launchLecture = (uId, lId) => {
            const lecture = store.find(u => u.id === uId).lectures.find(l => l.id === lId);
            const container = document.getElementById('vContainer');
            container.innerHTML = `<h2 class="text-3xl font-black text-slate-800 mb-10 border-l-8 border-indigo-600 pl-6">${lecture.name}</h2>`;
            (lecture.videos || []).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).forEach(v => {
                const box = document.createElement('div');
                box.className = "video-box flex items-center gap-4";
                box.onclick = () => utils.openInYouTube(utils.extractVideoId(v.embed));
                box.innerHTML = `
                    <div class="w-16 h-16 bg-slate-100 rounded-lg flex items-center justify-center"><i class="fab fa-youtube text-red-600 text-2xl"></i></div>
                    <div><h3 class="text-[10px] font-black text-slate-400 uppercase">Lesson</h3><p class="font-bold text-slate-800">${v.name}</p></div>
                `;
                container.appendChild(box);
            });
            document.getElementById('viewerOverlay').classList.remove('hidden');
        };

        document.getElementById('dataForm').onsubmit = async (e) => {
            e.preventDefault();
            utils.haptic();
            const type = document.getElementById('fType').value;
            const id = document.getElementById('fId').value;
            const payload = { 
                name: document.getElementById('fName').value,
                ...(type === 'LECTURE' && { unit_id: document.getElementById('fParentId').value }),
                ...(type === 'VIDEO' && { lecture_id: document.getElementById('fParentId').value, embed: document.getElementById('fEmbed').value })
            };
            const table = type.toLowerCase() + 's';
            if (id) await _db.from(table).update(payload).eq('id', id); else await _db.from(table).insert([payload]);
            await logic.sync();
            if(activeLectureId) window.ui.selectAdminLecture(currentUnitId, activeLectureId);
            document.getElementById('adminFormArea').classList.add('hidden');
        };

        document.getElementById('delBtn').onclick = async () => {
            utils.haptic();
            if (!confirm("Delete permanently?")) return;
            await _db.from(document.getElementById('fType').value.toLowerCase() + 's').delete().eq('id', document.getElementById('fId').value);
            await logic.sync();
            window.ui.loadAdminLectures(currentUnitId);
            document.getElementById('adminFormArea').classList.add('hidden');
            activeLectureId = null;
        };

        document.getElementById('openAdmin').onclick = () => { utils.haptic(); document.getElementById('adminModal').classList.remove('hidden'); };
        document.getElementById('cancelForm').onclick = () => {
            utils.haptic();
            document.getElementById('adminFormArea').classList.add('hidden');
            if(activeLectureId) window.ui.selectAdminLecture(currentUnitId, activeLectureId);
        };

        logic.sync();
    </script>
</body>
</html>
