<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机点名生成器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-top: 20px;
        }
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }
        .description {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 18px;
        }
        .input-section {
            margin-bottom: 25px;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            resize: vertical;
            transition: border-color 0.3s;
        }
        textarea:focus {
            border-color: #3498db;
            outline: none;
        }
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        #generateBtn {
            background: #3498db;
            color: white;
            box-shadow: 0 4px 8px rgba(52, 152, 219, 0.3);
        }
        #generateBtn:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }
        #downloadBtn {
            background: #27ae60;
            color: white;
            box-shadow: 0 4px 8px rgba(39, 174, 96, 0.3);
        }
        #downloadBtn:hover {
            background: #219653;
            transform: translateY(-2px);
        }
        #previewBtn {
            background: #e67e22;
            color: white;
            box-shadow: 0 4px 8px rgba(230, 126, 34, 0.3);
        }
        #previewBtn:hover {
            background: #d35400;
            transform: translateY(-2px);
        }
        .instructions {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            border-left: 4px solid #3498db;
        }
        .instructions h3 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .instructions ol {
            padding-left: 20px;
        }
        .instructions li {
            margin-bottom: 8px;
        }
        .preview {
            display: none;
            margin-top: 30px;
            text-align: center;
        }
        .preview iframe {
            width: 100%;
            height: 500px;
            border: 2px solid #ddd;
            border-radius: 8px;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            color: white;
            font-size: 14px;
        }
        .example {
            font-size: 14px;
            color: #7f8c8d;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>随机点名生成器</h1>
    <p class="description">输入学生姓名，生成并下载随机点名器HTML文件</p>
    
    <div class="container">
        <h2>学生名单输入</h2>
        <div class="input-section">
            <textarea id="nameInput" placeholder="请输入学生姓名，每行一个&#10;例如：&#10;张三&#10;李四&#10;王五"></textarea>
            <p class="example">每行输入一个学生姓名，空行将被自动忽略</p>
        </div>
        
        <div class="buttons">
            <button id="generateBtn">生成点名器</button>
            <button id="downloadBtn" disabled>下载HTML文件</button>
            <button id="previewBtn" disabled>预览点名器</button>
        </div>
        
        <div class="instructions">
            <h3>使用说明</h3>
            <ol>
                <li>在文本框中输入学生姓名，每行一个</li>
                <li>点击"生成点名器"按钮</li>
                <li>点击"下载HTML文件"保存随机点名器</li>
                <li>点击"预览点名器"查看效果</li>
                <li>下载的HTML文件可以在任何浏览器中打开使用</li>
            </ol>
        </div>
        
        <div id="preview" class="preview">
            <h2>点名器预览</h2>
            <iframe id="previewFrame" sandbox="allow-scripts"></iframe>
        </div>
    </div>
    
    <div class="footer">
        <p>随机点名生成器 &copy; 2023 - 教师课堂助手</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const nameInput = document.getElementById('nameInput');
            const generateBtn = document.getElementById('generateBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const previewBtn = document.getElementById('previewBtn');
            const preview = document.getElementById('preview');
            const previewFrame = document.getElementById('previewFrame');
            
            let nameList = [];
            let htmlContent = '';
            
            // 示例数据
            nameInput.value = "张三\n李四\n王五\n赵六\n钱七\n孙八\n周九\n吴十";
            
            generateBtn.addEventListener('click', function() {
                const inputText = nameInput.value.trim();
                if (inputText === '') {
                    alert('请输入至少一个学生姓名！');
                    return;
                }
                
                nameList = inputText.split('\n')
                    .map(name => name.trim())
                    .filter(name => name !== '');
                
                if (nameList.length === 0) {
                    alert('请输入有效的学生姓名！');
                    return;
                }
                
                // 生成HTML内容
                htmlContent = generateNamePickerHTML(nameList);
                
                // 启用下载和预览按钮
                downloadBtn.disabled = false;
                previewBtn.disabled = false;
                
                alert('点名器生成成功！现在可以下载或预览。');
            });
            
            downloadBtn.addEventListener('click', function() {
                if (!htmlContent) {
                    alert('请先生成点名器！');
                    return;
                }
                
                // 创建下载链接
                const blob = new Blob([htmlContent], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = '随机点名器.html';
                document.body.appendChild(a);
                a.click();
                
                // 清理
                setTimeout(function() {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);
            });
            
            previewBtn.addEventListener('click', function() {
                if (!htmlContent) {
                    alert('请先生成点名器！');
                    return;
                }
                
                // 在iframe中显示预览
                const blob = new Blob([htmlContent], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                previewFrame.src = url;
                
                preview.style.display = 'block';
                preview.scrollIntoView({ behavior: 'smooth' });
                
                // 清理URL当iframe卸载时
                previewFrame.addEventListener('load', function() {
                    URL.revokeObjectURL(url);
                });
            });
            
            function generateNamePickerHTML(names) {
                return `<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课堂随机点名器</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .name-display {
            font-size: 42px;
            height: 100px;
            margin: 30px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8f9fa;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }
        .name-display.highlight {
            color: #e74c3c;
            font-weight: bold;
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.3);
        }
        .controls {
            margin: 20px 0;
        }
        button {
            padding: 12px 30px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 8px rgba(52, 152, 219, 0.3);
        }
        button:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }
        button:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }
        .student-list {
            margin-top: 30px;
            text-align: left;
        }
        .student-list h3 {
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }
        .student-list ul {
            columns: 2;
            list-style-type: none;
            padding: 0;
        }
        .student-list li {
            padding: 5px 0;
            border-bottom: 1px dashed #eee;
        }
        @media (max-width: 500px) {
            .student-list ul {
                columns: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>课堂随机点名器</h1>
        
        <div class="name-display" id="nameDisplay">
            <span id="selectedName">等待点名</span>
        </div>
        
        <div class="controls">
            <button id="startBtn">开始点名</button>
        </div>
        
        <div class="student-list">
            <h3>学生名单 (共 <span id="studentCount">${names.length}</span> 人)</h3>
            <ul>
                ${names.map(name => `<li>${name}</li>`).join('')}
            </ul>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const nameDisplay = document.getElementById('nameDisplay');
            const selectedName = document.getElementById('selectedName');
            const startBtn = document.getElementById('startBtn');
            
            const names = ${JSON.stringify(names)};
            let isSelecting = false;
            
            startBtn.addEventListener('click', function() {
                if (isSelecting) return;
                startSelection();
            });
            
            function startSelection() {
                isSelecting = true;
                startBtn.disabled = true;
                nameDisplay.classList.remove('highlight');
                
                const totalTime = 5000; // 5秒总时间
                const initialSpeed = 80; // 初始速度（毫秒）
                let slowDownStartTime = totalTime * 0.6; // 从60%的时间开始减速
                
                const startTime = Date.now();
                
                function updateSelection() {
                    const elapsed = Date.now() - startTime;
                    const remaining = totalTime - elapsed;
                    
                    if (remaining <= 0) {
                        // 选择最终名字
                        const finalIndex = Math.floor(Math.random() * names.length);
                        selectedName.textContent = names[finalIndex];
                        nameDisplay.classList.add('highlight');
                        isSelecting = false;
                        startBtn.disabled = false;
                        return;
                    }
                    
                    // 逐渐减慢速度
                    let speed;
                    if (elapsed < slowDownStartTime) {
                        // 快速阶段
                        speed = initialSpeed;
                    } else {
                        // 减速阶段 - 使用二次缓动函数
                        const progress = (elapsed - slowDownStartTime) / (totalTime - slowDownStartTime);
                        speed = initialSpeed + (progress * progress * 500);
                    }
                    
                    // 显示随机名字
                    const randomIndex = Math.floor(Math.random() * names.length);
                    selectedName.textContent = names[randomIndex];
                    
                    setTimeout(updateSelection, speed);
                }
                
                updateSelection();
            }
        });
    <\/script>
</body>
</html>`;
            }
        });
    </script>
</body>
</html>
